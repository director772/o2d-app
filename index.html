          b.onclick = function () { A.go('step', { orderId: b.getAttribute('data-oid'), stepKey: step }); };
        });
        // Upar ke orders ki detail pehle se le aao → tap karte hi form khule
        if (!isOld) A.prefetchDetails(g.items.map(function (c) { return c.orderId; }));
      }

      load(true);
      timer = setInterval(function () { load(false); }, 60000);
    }
  };

})(window.O2D);
</script>

  <!--
  ============================================================
   Screen_StepForm.html  —  Step bharne ki screen
  ============================================================
   Order card pe tap karte hi yeh khulti hai:
   1. Upar order ki details (customer, item, payment, parchi photo,
      pichle steps ki jaankari — bill no., courier type...)
   2. Deadline ka rang (laal / peela / hara / neela)
   3. Abhi wale step ka form:
        Stock Hai?      → Haan / Nahi (Nahi pe "Maal kab tak aayega")
        Maal Ready      → ek button
        Bill Banao      → Bill Number + bill photo
        Bill Se Check   → "Sab Sahi Hai" / "Galti Mili"
        Packing         → By Courier / By Hand + packing photos / video
                          (video 3 tak, 1 minute tak — chunte hi upload)
                          "Is baar photo / video skip karo" tick → zaroori nahi
        Transport/Bilty → Transporter + Bilty No. + bilty photo
                          (By Hand ho toh bilty zaroori nahi)
   4. Staff ka naam login se apne aap jaata hai. Director / PC ke liye
      "Kaam kisne kiya" + "Kaam kab hua"
   5. Late ho toh "Late kyun hua?" pehle hi poochta hai, phir save
   6. SAVE PEECHE SE: "Done" dabate hi screen wapas list pe (order list se
      hat jaata hai), save background mein hota hai. Time wahi gina jaata
      hai jab button dabaya (net slow ho tab bhi). Save na ho paaye toh
      saaf message + "Dobara try karo" / "Order kholo".
  ============================================================
-->
<script>
(function (A) {
  'use strict';

  function stepCfg(key) {
    return (A.config.steps || []).filter(function (s) { return s.key === key; })[0] || { fields: [], staffNames: [] };
  }
  function goBack() {
    if (A.lastStep) A.go('myWork', { step: A.lastStep });
    else A.go('home');
  }
  function row(label, value) {
    if (!value) return '';
    return '<li class="row between" style="align-items:flex-start"><span class="muted">' + A.esc(label) + '</span>' +
           '<span style="text-align:right;font-weight:500">' + value + '</span></li>';
  }
  function photoLinks(urls) { return A.mediaLinks(urls); }

  A.screens.step = {
    render: function (view, params) {
      view.innerHTML = A.pageHead('Order', 'Load ho raha hai...') + '<div id="sf-body"></div>';
      // Phone mein pehle se ho toh turant form; taaza data aane pe sirf tab dobara banao
      // jab order sach mein badla ho (warna bhar rahe form ko mat chhedo)
      let shown = null;
      A.fast('orderDetail', { orderId: params.orderId }, function (d, isOld) {
        if (A.current !== 'step') return;
        if (!shown) { shown = d; draw(view, d); return; }
        if (!isOld && (d.currentStep !== shown.currentStep || d.cancelled !== shown.cancelled || d.complete !== shown.complete)) {
          shown = d; draw(view, d);
          A.toast('Is order mein abhi badlav hua hai — taaza dikha rahe hain.', 'err');
        }
      }, 'Order khul raha hai...', true)
        .catch(function (e) { if (!shown) A.$('#sf-body', view).innerHTML = '<div class="note err">' + A.esc(e.message) + '</div>'; });
    }
  };

  function draw(view, d) {
    const stepKey = d.currentStep;
    const cfg = stepCfg(stepKey);
    const prev = {};
    (d.steps || []).forEach(function (s) { prev[s.key] = s; });
    const byHand = prev.PACKAGING && String(prev.PACKAGING.fields.COURIER_TYPE || '').toLowerCase() === 'by hand';

    // ---------- Upar: order ki jaankari ----------
    let html = A.pageHead(d.complete ? 'Order complete' : d.currentLabel,
      d.orderId + ' · ' + d.customer,
      '<button class="btn btn-ghost btn-sm" id="sf-back">Wapas</button>');

    if (d.cancelled) html += '<div class="note err">Yeh order cancel ho chuka hai: ' + A.esc(d.cancelReason) + '</div>';
    else if (d.signal && d.signal.text && !d.complete) {
      const cls = d.signal.color === 'red' ? 'err' : (d.signal.color === 'yellow' ? 'warn' : '');
      html += '<div class="note ' + cls + '">' + A.esc(d.signal.text) + '</div>';
    }

    const extra = [];
    if (prev.STOCK_CHECK && prev.STOCK_CHECK.done) {
      extra.push(row('Stock', A.esc(prev.STOCK_CHECK.status) + (prev.STOCK_CHECK.fields.MAAL_KAB_AAYEGA ? ' — maal ' + A.esc(prev.STOCK_CHECK.fields.MAAL_KAB_AAYEGA) : '')));
    }
    if (prev.INVOICE && prev.INVOICE.done) extra.push(row('Bill', A.esc(prev.INVOICE.fields.BILL_NUMBER) + (prev.INVOICE.photos.length ? ' — ' + photoLinks(prev.INVOICE.photos) : '')));
    if (prev.PACKAGING && prev.PACKAGING.done) extra.push(row('Packing', A.esc(prev.PACKAGING.fields.COURIER_TYPE) + (prev.PACKAGING.photos.length ? ' — ' + photoLinks(prev.PACKAGING.photos) : '')));

    html += '<div class="panel"><ul class="list-plain">' +
      row('Customer', A.esc(d.customer)) +
      row('Shahar', A.esc(d.city)) +
      row('Phone', d.phone ? '<a href="tel:' + A.esc(d.phone) + '">' + A.esc(d.phone) + '</a>' : '') +
      row('Item', A.esc(d.item)) +
      row('Order Type', A.esc(d.orderType)) +
      row('Payment', A.esc(d.payment)) +
      row('Salesperson', A.esc(d.salesperson)) +
      row('Order kab aaya', A.esc(d.orderTime)) +
      row('Parchi', photoLinks(d.orderPhotos)) +
      extra.join('') +
      '</ul></div>';

    // ---------- Form ----------
    if (d.cancelled || d.complete) {
      html += '';
    } else if (!d.canAct) {
      html += '<div class="note">Yeh step ("' + A.esc(d.currentLabel) + '") aapke paas nahi hai.</div>';
    } else {
      html += '<div class="panel"><div class="panel-head"><h3>' + A.esc(d.currentLabel) + '</h3></div><div id="sf-form"></div></div>';
    }
    A.$('#sf-body', view).innerHTML = '';
    view.innerHTML = html;
    A.$('#sf-back', view).onclick = goBack;
    if (!A.$('#sf-form', view)) return;

    buildForm(A.$('#sf-form', view), d, stepKey, cfg, byHand);
  }

  /* ---------------- Har step ka form ---------------- */

  function buildForm(box, d, stepKey, cfg, byHand) {
    const state = { decision: '', choices: {}, pickers: {} };
    let h = '';

    // Sabse upar: "Aapka naam" (Director login ho toh "Kaam kisne kiya")
    h += A.nameSelectHtml(stepKey, 'in-doneBy');

    if (stepKey === 'STOCK_CHECK') {
      h += '<div class="field"><label>Godown mein maal hai?</label>' +
           '<div class="yesno"><button type="button" class="choice yes" data-dec="Yes">Haan, hai</button>' +
           '<button type="button" class="choice no" data-dec="No">Nahi hai</button></div></div>' +
           '<div class="field hide" id="f-date"><label>Maal kab tak aayega? <span class="req">*</span></label>' +
           '<input class="input" type="date" id="in-MAAL_KAB_AAYEGA" min="' + A.esc(A.config.today) + '">' +
           '<div class="hint">Us din shaam tak maal ready karna hoga. Chhutti ka din nahi chalega.</div></div>';
    } else if (stepKey === 'BILL_CHECK') {
      h += '<p class="muted" style="margin-top:0">Maal ko bill se milao — pcs, size, item.</p>';
    } else if (stepKey === 'MAAL_READY') {
      h += '<p class="muted" style="margin-top:0">Maal nikaal ke alag rakh diya? Toh neeche button dabao.</p>';
    }

    if (stepKey === 'DISPATCH' && byHand) {
      h += '<div class="note">Is order ki packing <b>By Hand</b> thi — customer khud le gaya. Bilty zaroori nahi.</div>';
    }

    // Baaki fields settings se
    (cfg.fields || []).forEach(function (f) {
      if (stepKey === 'STOCK_CHECK') return;
      const req = f.required && !(stepKey === 'DISPATCH' && byHand);
      const star = req ? ' <span class="req">*</span>' : '';
      if (f.type === 'select') {
        h += '<div class="field"><label>' + A.esc(f.header) + star + '</label><div class="choices" data-sel="' + f.key + '">' +
             f.options.map(function (o) { return '<button type="button" class="choice" data-v="' + A.esc(o) + '">' + A.esc(o) + '</button>'; }).join('') +
             '</div></div>';
      } else if (f.type === 'photos') {
        h += '<div class="field"><label>' + A.esc(f.header) + star + '</label><div id="pk-' + f.key + '"></div>' +
             (f.key === 'PACKING_PHOTOS' ? '<div class="hint">Alag-alag angle se photo lo, taaki pcs aur packing saaf dikhe.</div>' : '') + '</div>';
        if (f.key === 'PACKING_PHOTOS') {
          h += '<div class="field"><label>Packing Video</label><div id="vk-PACKING"></div>' +
               '<div class="hint">3 video tak, har video 1 minute tak. Chunte hi upload shuru — screen band mat karna.</div></div>' +
               '<div class="field"><label class="row" style="gap:10px;cursor:pointer;font-weight:500">' +
               '<input type="checkbox" id="in-skipMedia" style="width:20px;height:20px;flex:none"> Is baar photo / video skip karo</label>' +
               '<div class="hint">Tick nahi = kam se kam 1 photo ya 1 video zaroori. Skip Activity Log mein likha jaayega.</div></div>';
        }
      } else {
        const ph = f.key === 'TRANSPORTER' ? 'Jaise: Umesh Sah Transport' : (f.key === 'BILL_NUMBER' ? 'Jaise: L/543' : '');
        h += '<div class="field"><label>' + A.esc(f.header) + star + '</label>' +
             '<input class="input" id="in-' + f.key + '" placeholder="' + A.esc(ph) + '" autocomplete="off">' + '</div>';
      }
    });

    // Sirf Director: kaam pehle hua tha toh time badal sakte hain
    if (A.director) {
      h += '<div class="field"><label>Kaam kab hua (sirf Director)</label><input class="input" type="datetime-local" id="in-doneAt">' +
           '<div class="hint">Khaali chhodo = abhi ka time</div></div>';
    }

    // Buttons
    if (stepKey === 'BILL_CHECK') {
      h += '<div class="btn-row"><button type="button" class="btn btn-warn" id="sf-issue">Galti mili</button>' +
           '<button type="button" class="btn btn-go" id="sf-save">Sab sahi hai</button></div>';
    } else {
      const label = { STOCK_CHECK: 'Save karo', MAAL_READY: 'Maal ready — Done', INVOICE: 'Bill save karo',
                      PACKAGING: 'Packing done', DISPATCH: 'Dispatch done' }[stepKey] || 'Done';
      h += '<button type="button" class="btn btn-go btn-block" id="sf-save">' + label + '</button>';
    }
    box.innerHTML = h;

    // ---- chalana ----
    A.$$('[data-dec]', box).forEach(function (b) {
      b.onclick = function () {
        state.decision = b.getAttribute('data-dec');
        A.$$('[data-dec]', box).forEach(function (x) { x.classList.toggle('on', x === b); });
        A.$('#f-date', box).classList.toggle('hide', state.decision !== 'No');
      };
    });
    A.$$('[data-sel]', box).forEach(function (wrap) {
      const key = wrap.getAttribute('data-sel');
      A.$$('.choice', wrap).forEach(function (b) {
        b.onclick = function () {
          state.choices[key] = b.getAttribute('data-v');
          A.$$('.choice', wrap).forEach(function (x) { x.classList.toggle('on', x === b); });
        };
      });
    });
    (cfg.fields || []).forEach(function (f) {
      if (f.type === 'photos' && A.$('#pk-' + f.key, box)) {
        state.pickers[f.key] = A.photoPicker(A.$('#pk-' + f.key, box), {
          label: f.key === 'BILL_PHOTO' ? 'Bill ki photo' : (f.key === 'BILTY_PHOTO' ? 'Bilty ki photo' : 'Photo lo'),
          max: f.key === 'PACKING_PHOTOS' ? A.config.photo.maxPerField : 3
        });
      }
    });
    if (A.$('#vk-PACKING', box)) {
      state.videos = A.videoPicker(A.$('#vk-PACKING', box), { orderId: d.orderId, max: 3, maxSeconds: 60, maxMb: 200 });
    }
    const doneAt = A.$('#in-doneAt', box);
    if (doneAt) doneAt.max = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16);

    const token = A.uid();

    function whoValue() {
      // Staff: naam login se apne aap. Director: dropdown (khaali = khud)
      const sel = A.$('#in-doneBy', box);
      return sel ? sel.value : '';
    }

    function collect() {
      const input = { fields: {}, photos: {}, clientToken: token };
      input.doneBy = whoValue();
      if (stepKey === 'STOCK_CHECK') {
        if (!state.decision) throw new Error('Haan ya Nahi chuno.');
        input.decision = state.decision;
        if (state.decision === 'No') input.fields.MAAL_KAB_AAYEGA = A.$('#in-MAAL_KAB_AAYEGA', box).value;
      }
      (cfg.fields || []).forEach(function (f) {
        if (stepKey === 'STOCK_CHECK') return;
        if (f.type === 'select') input.fields[f.key] = state.choices[f.key] || '';
        else if (f.type === 'photos') input.photos[f.key] = state.pickers[f.key] ? state.pickers[f.key].get() : [];
        else { const el = A.$('#in-' + f.key, box); if (el) input.fields[f.key] = el.value; }
      });
      if (state.videos) {
        if (state.videos.busy()) throw new Error('Video abhi upload ho rahi hai — thoda ruko, phir Save dabao.');
        if (state.videos.failed()) throw new Error('Ek video upload nahi hui — us pe tap karke "Dobara try karo" ya hatao.');
        input.videos = state.videos.get();
        const skipBox = A.$('#in-skipMedia', box);
        input.skipMedia = !!(skipBox && skipBox.checked);
        const nPhotos = (input.photos.PACKING_PHOTOS || []).length;
        if (!input.skipMedia && !nPhotos && !input.videos.length) {
          throw new Error('Packing ki kam se kam 1 photo ya 1 video daalo — ya "skip" pe tick karo.');
        }
      }
      if (doneAt && doneAt.value) input.doneAt = doneAt.value;
      return input;
    }

    let left = false;
    function send(input) {
      input.tapAt = input.tapAt || Date.now();          // button kab dabaya — yahi time gina jayega
      // Deadline pehle hi nikal chuki → wajah abhi pooch lo (server ka ek chakkar bacha)
      if (!input.lateReason && d.signal && d.signal.color === 'red') {
        return askLate({ message: d.orderId + ' — is step ki deadline nikal chuki hai.', reasons: A.config.lateReasons }, input, send);
      }
      const label = d.orderId + ' · ' + d.currentLabel;
      A.bgSave({
        label: label,
        orderId: d.orderId,
        run: function () { return A.api('submitStep', { stepKey: stepKey, orderId: d.orderId, input: input }); },
        okText: function (r) { return d.orderId + ': ' + (r.complete ? 'order complete ho gaya.' : 'ho gaya. Ab: ' + r.nextLabel); },
        onLate: function (r) { r.message = label + ' — ' + (r.message || 'late hai.'); askLate(r, input, send); }
      });
      A.cacheDropOrder(d.orderId);     // list / ginti se turant hatao
      if (!left) { left = true; goBack(); }
    }

    A.$('#sf-save', box).onclick = function () {
      try { send(collect()); } catch (e) { A.toast(e.message, 'err'); }
    };

    const issue = A.$('#sf-issue', box);
    if (issue) issue.onclick = function () {
      let who;
      try { who = whoValue(); } catch (e) { return A.toast(e.message, 'err'); }
      A.sheet('<h3>Kya galti mili?</h3>' +
        '<div class="field"><textarea class="textarea" id="g-note" placeholder="Jaise: 2 pcs kam hain, size 32 ki jagah 34"></textarea></div>' +
        '<div class="note warn">Order yahin ruka rahega. Galti theek hone ke baad "Sab sahi hai" dabana.</div>' +
        '<button class="btn btn-main btn-block" id="g-save">Galti record karo</button>',
        function (el, close) {
          A.$('#g-save', el).onclick = function () {
            A.call('billIssue', { orderId: d.orderId, note: A.$('#g-note', el).value, doneBy: who }, 'Record ho raha hai...')
              .then(function (r) { close(); A.cacheStale(); A.toast(r.message, 'ok'); })
              .catch(function () {});
          };
        });
    };
  }

  /* ---------------- Late kyun hua ---------------- */

  /** Late reason poochna — phir wahi data reason ke saath dobara save */
  function askLate(r, input, send) {
    const reasons = r.reasons || A.config.lateReasons || [];
    const other = reasons[reasons.length - 1];
    let picked = '';
    A.sheet('<h3>Late kyun hua?</h3>' +
      '<p class="muted" style="margin-top:0">' + A.esc(r.message) + '</p>' +
      '<div class="choices" id="lr">' + reasons.map(function (x) { return '<button type="button" class="choice" data-v="' + A.esc(x) + '">' + A.esc(x) + '</button>'; }).join('') + '</div>' +
      '<div class="field mt hide" id="lr-note-f"><label>Kya wajah thi? <span class="req">*</span></label><input class="input" id="lr-note"></div>' +
      '<button class="btn btn-go btn-block mt" id="lr-save">Save karo</button>',
      function (el, close) {
        A.$$('#lr .choice', el).forEach(function (b) {
          b.onclick = function () {
            picked = b.getAttribute('data-v');
            A.$$('#lr .choice', el).forEach(function (x) { x.classList.toggle('on', x === b); });
            A.$('#lr-note-f', el).classList.toggle('hide', picked !== other);
          };
        });
        A.$('#lr-save', el).onclick = function () {
          const note = A.$('#lr-note', el).value.trim();
          if (!picked) return A.toast('Ek wajah chuno.', 'err');
          if (picked === other && !note) return A.toast('Wajah likho.', 'err');
          input.lateReason = picked;
          input.lateNote = note;
          close();
          send(input);
        };
      });
  }

})(window.O2D);
</script>

  <!--
  ============================================================
   Screen_NewOrder.html  —  "Naya Order" (Salesperson)
  ============================================================
   Purane Google Form ki jagah:
   - Customer ka naam, phone, shahar
   - Item (ek se zyada chun sakte hain)
   - Customer Type, Order Type, Payment — bade button, dropdown nahi
   - Order parchi ki photo (zaroori)
   - Salesperson ka naam login se apne aap; Director kisi ki taraf se bhi bhar sakta hai
   Save hote hi Order ID (OD-211026-01) bada dikhta hai.
   Double tap se do order nahi bante.
  ============================================================
-->
<script>
(function (A) {
  'use strict';

  function cfg() {
    return (A.config.steps || []).filter(function (s) { return s.key === 'ORDER_ENTRY'; })[0] || { fields: [], staffNames: [] };
  }

  A.screens.newOrder = {
    render: function (view) {
      const c = cfg();
      const F = {};
      c.fields.forEach(function (f) { F[f.key] = f; });
      const chosen = { ITEM: [] };
      let picker = null;
      const token = A.uid();

      function choicesHtml(f, multi) {
        return '<div class="choices" data-f="' + f.key + '"' + (multi ? ' data-multi="1"' : '') + '>' +
          f.options.map(function (o) { return '<button type="button" class="choice" data-v="' + A.esc(o) + '">' + A.esc(o) + '</button>'; }).join('') +
          '</div>';
      }
      function label(f, txt) {
        return '<label>' + A.esc(txt || f.header) + (f.required ? ' <span class="req">*</span>' : '') + '</label>';
      }

      view.innerHTML =
        A.pageHead('Naya Order', 'Customer ka order yahan bharo') +

        '<div class="panel"><div class="panel-head"><h3>Customer</h3></div>' +
          '<div class="form-grid">' +
            '<div class="field full">' + label(F.CUSTOMER_NAME, 'Customer / Party ka naam') +
              '<input class="input" id="o-name" placeholder="Jaise: Jk Snr" autocomplete="off"></div>' +
            '<div class="field">' + label(F.PHONE, 'Phone number') +
              '<input class="input" id="o-phone" type="tel" inputmode="numeric" maxlength="14" placeholder="10 ank"></div>' +
            '<div class="field">' + label(F.CITY, 'Shahar') +
              '<input class="input" id="o-city" placeholder="Jaise: Srinagar" autocomplete="off"></div>' +
          '</div>' +
          '<div class="field">' + label(F.CUSTOMER_TYPE) + choicesHtml(F.CUSTOMER_TYPE) + '</div>' +
        '</div>' +

        '<div class="panel"><div class="panel-head"><h3>Order</h3></div>' +
          '<div class="field">' + label(F.ITEM, 'Item (ek se zyada chun sakte ho)') + choicesHtml(F.ITEM, true) + '</div>' +
          '<div class="field">' + label(F.ORDER_TYPE) + choicesHtml(F.ORDER_TYPE) + '</div>' +
          '<div class="field">' + label(F.PAYMENT) + choicesHtml(F.PAYMENT) + '</div>' +
          '<div class="field">' + label(F.ORDER_PHOTO, 'Order parchi ki photo') + '<div id="o-photo"></div></div>' +
        '</div>' +

        (A.director ? '<div class="panel" style="padding-bottom:0">' + A.nameSelectHtml('ORDER_ENTRY', 'o-by', 'Kis salesperson ka order hai?') + '</div>' : '') +

        '<button type="button" class="btn btn-go btn-block" id="o-save">Order save karo</button>';

      picker = A.photoPicker(A.$('#o-photo', view), { label: 'Parchi ki photo', max: 5 });

      A.$$('[data-f]', view).forEach(function (wrap) {
        const key = wrap.getAttribute('data-f');
        const multi = wrap.getAttribute('data-multi') === '1';
        A.$$('.choice', wrap).forEach(function (b) {
          b.onclick = function () {
            const v = b.getAttribute('data-v');
            if (multi) {
              const i = chosen[key].indexOf(v);
              if (i >= 0) chosen[key].splice(i, 1); else chosen[key].push(v);
              b.classList.toggle('on', i < 0);
            } else {
              chosen[key] = v;
              A.$$('.choice', wrap).forEach(function (x) { x.classList.toggle('on', x === b); });
            }
          };
        });
      });

      A.$('#o-save', view).onclick = function () {
        const p = {
          customerName: A.$('#o-name', view).value.trim(),
          phone: A.$('#o-phone', view).value.trim(),
          city: A.$('#o-city', view).value.trim(),
          item: chosen.ITEM,
          customerType: chosen.CUSTOMER_TYPE || '',
          orderType: chosen.ORDER_TYPE || '',
          payment: chosen.PAYMENT || '',
          photos: picker.get(),
          salesperson: A.$('#o-by', view) ? A.$('#o-by', view).value : '',
          clientToken: token
        };
        // Screen pe hi pehli jaanch (server phir se check karta hai)
        if (!p.customerName) return A.toast('Customer ka naam likho.', 'err');
        if (!p.customerType) return A.toast('Customer Type chuno.', 'err');
        if (!p.orderType) return A.toast('Order Type chuno.', 'err');
        if (!p.payment) return A.toast('Payment chuno.', 'err');
        if (!p.photos.length) return A.toast('Order parchi ki photo lo.', 'err');

        A.call('createOrder', p, 'Order save ho raha hai...')
          .then(function (r) { A.cacheStale(); done(view, r); })
          .catch(function () {});
      };
    }
  };

  function done(view, r) {
    view.innerHTML =
      '<div class="panel" style="text-align:center;padding:32px 16px">' +
        '<div style="width:56px;height:56px;border-radius:50%;background:var(--green-bg);color:var(--green);display:flex;align-items:center;justify-content:center;margin:0 auto 12px">' +
          '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12l5 5 9-10"/></svg></div>' +
        '<div class="muted">Order save ho gaya</div>' +
        '<div style="font-size:30px;font-weight:700;letter-spacing:.5px;color:var(--brand);margin:4px 0 6px">' + A.esc(r.orderId) + '</div>' +
        '<div class="muted small">Ab yeh Stock Team ki list mein hai.</div>' +
      '</div>' +
      (r.warning ? '<div class="note warn">' + A.esc(r.warning) + '</div>' : '') +
      '<div class="btn-row">' +
        (A.screens.orders ? '<button class="btn btn-ghost" id="d-list">Sab orders</button>' : '') +
        '<button class="btn btn-main" id="d-new">Aur naya order</button>' +
      '</div>';
    A.$('#d-new', view).onclick = function () { A.go('newOrder'); };
    const l = A.$('#d-list', view);
    if (l) l.onclick = function () { A.go('orders'); };
  }

})(window.O2D);
</script>

  <!--
  ============================================================
   Screen_Orders.html  —  "Mere Orders" / "Sab Orders"
  ============================================================
   - Salesperson: apne orders | Director / PC: sabke orders
   - Har order pe: abhi kahan hai ("Bill Banao — Harshit ke paas")
     ya "Dispatch ho gaya" + transporter
   - ORDER KA SAFAR: har card pe 7 khaane — hara = ho gaya,
     rangeen = abhi yahan, grey = baaki
   - Upar "Kis step pe kitne": dabao → sirf us step ke orders
   - Filter: Chalu / Complete / Sab
   - Search: Order ID, customer, shahar, bill no., phone
   - Card pe tap → order ki poori kahani
  ============================================================
-->
<script>
(function (A) {
  'use strict';

  A.screens.orders = {
    render: function (view) {
      let filter = 'running';
      let data = null;

      view.innerHTML =
        A.pageHead('Sab Orders', 'Pichle 30 din') +
        '<div class="panel" style="padding:12px">' +
          '<div class="row" style="gap:8px">' +
            '<input class="input" id="or-q" placeholder="Order ID, customer, bill no. ya phone" autocomplete="off" style="flex:1">' +
            '<button class="btn btn-main" id="or-go" style="min-width:90px">Dhoondho</button>' +
          '</div>' +
          '<div class="choices mt" id="or-f">' +
            '<button type="button" class="choice on" data-f="running">Chalu</button>' +
            '<button type="button" class="choice" data-f="complete">Complete</button>' +
            '<button type="button" class="choice" data-f="all">Sab</button>' +
          '</div>' +
        '</div>' +
        '<div id="or-steps"></div>' +
        '<div id="or-list"></div>';

      const list = A.$('#or-list', view);
      let stepFilter = '';

      // Order ka safar — 7 khaane
      const NOW_COLOR = { red: 'var(--red)', yellow: 'var(--amber)', wait: 'var(--blue)', green: 'var(--brand)' };
      function flowHtml(c) {
        const f = c.flow || [];
        if (!f.length) return '';
        const nowCol = NOW_COLOR[c.color] || 'var(--brand)';
        return '<div style="display:flex;gap:3px;margin-top:10px" aria-label="Order ka safar">' +
          f.map(function (x) {
            const col = x.st === 'd' ? 'var(--green)' : (x.st === 'n' ? nowCol : 'var(--border)');
            const txt = x.st === 'n' ? 'color:' + nowCol + ';font-weight:700' : (x.st === 'd' ? 'color:var(--text-2)' : 'color:var(--text-3, #98A2B3)');
            return '<div style="flex:1;min-width:0;text-align:center">' +
              '<div style="height:6px;border-radius:3px;background:' + col + '"></div>' +
              '<div style="font-size:10.5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;' + txt + '">' +
                (x.st === 'd' ? '✓ ' : '') + A.esc(x.s) + '</div></div>';
          }).join('') + '</div>';
      }

      // Kis step pe kitne chalu orders — dabao toh sirf wahi
      function drawSteps() {
        const box = A.$('#or-steps', view);
        if (!data || filter === 'complete') { box.innerHTML = ''; return; }
        const counts = {}, order = [];
        data.items.forEach(function (c) {
          if (c.complete || !c.step) return;
          if (!counts[c.step]) { counts[c.step] = { label: c.stepLabel, n: 0, red: 0 }; order.push(c.step); }
          counts[c.step].n++;
          if (c.color === 'red') counts[c.step].red++;
        });
        const steps = (A.config.steps || []).map(function (s) { return s.key; }).filter(function (k) { return counts[k]; });
        if (!steps.length) { box.innerHTML = ''; return; }
        box.innerHTML = '<div class="panel" style="padding:12px"><div class="muted small" style="margin-bottom:8px">Kis step pe kitne order — dabao toh sirf wahi dikhenge</div>' +
          '<div class="choices" style="flex-wrap:wrap">' +
            '<button type="button" class="choice' + (stepFilter ? '' : ' on') + '" data-s="">Sab step</button>' +
            steps.map(function (k) {
              const x = counts[k];
              return '<button type="button" class="choice' + (stepFilter === k ? ' on' : '') + '" data-s="' + A.esc(k) + '">' +
                A.esc(x.label) + ' <b>' + x.n + '</b>' + (x.red ? ' <span style="color:var(--red)">(' + x.red + ' late)</span>' : '') + '</button>';
            }).join('') +
          '</div></div>';
        A.$$('[data-s]', box).forEach(function (b) {
          b.onclick = function () { stepFilter = b.getAttribute('data-s'); drawList(); };
        });
      }

      function cardsHtml(items) {
        if (!items.length) return '<div class="panel empty"><b>Koi order nahi mila</b>' +
          (filter === 'running' ? 'Abhi koi order chalu nahi hai.' : 'Filter badal ke dekho.') + '</div>';
        return items.map(function (c) {
          const foot = c.complete
            ? '<span>Dispatch: ' + A.esc(c.dispatchedAt || '-') + (c.transporter ? ' · ' + A.esc(c.transporter) : '') + '</span>'
            : '<span>' + A.esc(c.whereNow || c.stepLabel || '') + '</span>';
          const card = Object.assign({}, c);
          if (c.complete) { card.color = 'done'; card.signal = 'Complete'; }
          if (c.cancelled) { card.color = ''; card.signal = 'Cancel'; }
          return A.slipHtml(card, foot + '<span>' + A.esc(c.orderTime || '') + '</span>')
            .replace('<div class="slip-foot">', flowHtml(c) + '<div class="slip-foot">');
        }).join('');
      }

      function bind() {
        A.$$('.slip', list).forEach(function (b) {
          b.onclick = function () { A.go('orderDetail', { orderId: b.getAttribute('data-oid'), back: 'orders' }); };
        });
      }

      function drawList() {
        if (!data) return;
        drawSteps();
        const items = data.items.filter(function (c) {
          if (stepFilter && (c.complete || c.step !== stepFilter)) return false;
          if (filter === 'running') return !c.complete;
          if (filter === 'complete') return c.complete;
          return true;
        });
        A.$('.screen-sub', view).textContent = 'Pichle 30 din · ' + data.running + ' chalu · ' + data.complete + ' complete';
        list.innerHTML = cardsHtml(items);
        bind();
      }

      function load() {
        A.fast('orders', { days: 30 }, function (d) {
          if (A.current !== 'orders') return;
          data = d;
          if (!A.$('#or-q', view).value.trim()) drawList();     // search chal raha ho toh beech mein na badlo
        }, 'Orders la rahe hain...', true)
          .catch(function (e) { list.innerHTML = '<div class="note err">' + A.esc(e.message) + '</div>'; });
      }

      function search() {
        const q = A.$('#or-q', view).value.trim();
        if (!q) { drawList(); return; }
        A.call('search', { query: q }, 'Dhoondh rahe hain...')
          .then(function (items) {
            A.$('.screen-sub', view).textContent = '"' + q + '" ke liye ' + items.length + ' order';
            list.innerHTML = cardsHtml(items.map(function (c) {
              c.whereNow = c.complete ? 'Complete' : c.stepLabel;
              return c;
            }));
            bind();
          })
          .catch(function () {});
      }

      A.$$('#or-f .choice', view).forEach(function (b) {
        b.onclick = function () {
          filter = b.getAttribute('data-f'); stepFilter = '';
          A.$$('#or-f .choice', view).forEach(function (x) { x.classList.toggle('on', x === b); });
          A.$('#or-q', view).value = '';
          drawList();
        };
      });
      A.$('#or-go', view).onclick = search;
      A.$('#or-q', view).addEventListener('keydown', function (e) { if (e.key === 'Enter') search(); });

      load();
    }
  };

})(window.O2D);
</script>

  <!--
  ============================================================
   Screen_OrderDetail.html  —  Order ki poori kahani
  ============================================================
   - Upar: Order ID, customer, abhi kahan hai (rang ke saath)
   - Order ki details + parchi photo
   - Har step ek line mein (timeline):
       ✔ ho gaya — kab, kisne (entry kisi aur ne ki ho toh woh bhi),
         late tha toh kyun, details (bill no., courier, transporter),
         photos
       ● abhi yahan ruka hai — deadline
       ○ abhi baaki
   - Activity Log (galti mili, cancel wagairah sab)
   - Button: "Yeh step bharo" (agar aapka step hai)
   - Director: "Order cancel karo" (reason ke saath)
  ============================================================
-->
<script>
(function (A) {
  'use strict';

  const FIELD_LABEL = {
    MAAL_KAB_AAYEGA: 'Maal kab aayega', BILL_NUMBER: 'Bill No.', COURIER_TYPE: 'Courier',
    TRANSPORTER: 'Transporter', BILTY_NO: 'Bilty No.'
  };

  function links(urls) { return A.mediaLinks(urls); }   // "Photo 1 · Video 1"

  A.screens.orderDetail = {
    render: function (view, params) {
      view.innerHTML = A.pageHead('Order', 'Load ho raha hai...') + '<div id="od-body"></div>';
      let shown = false;
      A.fast('orderDetail', { orderId: params.orderId }, function (d) {
        if (A.current !== 'orderDetail') return;
        shown = true; draw(view, d, params);
      }, 'Order khul raha hai...', true)
        .catch(function (e) { if (!shown) A.$('#od-body', view).innerHTML = '<div class="note err">' + A.esc(e.message) + '</div>'; });
    }
  };

  function draw(view, d, params) {
    const back = params.back || 'orders';
    let status;
    if (d.cancelled) status = '<span class="pill">Cancel</span>';
    else if (d.complete) status = '<span class="pill done">Complete</span>';
    else status = '<span class="pill ' + A.esc(d.signal.color) + '">' + A.esc(d.currentLabel + ' — ' + d.signal.text) + '</span>';

    let h = A.pageHead(d.orderId, d.customer + (d.city ? ' · ' + d.city : ''),
      '<button class="btn btn-ghost btn-sm" id="od-back">Wapas</button>');

    h += '<div class="panel"><div class="row between" style="flex-wrap:wrap;gap:8px">' + status +
         '<span class="muted small">Order: ' + A.esc(d.orderTime) + '</span></div>' +
         (d.cancelled ? '<div class="note err mt" style="margin-bottom:0">Cancel ki wajah: ' + A.esc(d.cancelReason) + '</div>' : '') +
         '</div>';

    // Order details
    const det = [
      ['Phone', d.phone ? '<a href="tel:' + A.esc(d.phone) + '">' + A.esc(d.phone) + '</a>' : ''],
      ['Item', A.esc(d.item)], ['Customer Type', A.esc(d.customerType)], ['Order Type', A.esc(d.orderType)],
      ['Payment', A.esc(d.payment)], ['Salesperson', A.esc(d.salesperson)], ['Parchi', links(d.orderPhotos)]
    ].filter(function (x) { return x[1]; });
    h += '<div class="panel"><div class="panel-head"><h3>Order ki jaankari</h3></div><ul class="list-plain">' +
         det.map(function (x) { return '<li class="row between" style="align-items:flex-start"><span class="muted">' + x[0] + '</span><span style="text-align:right;font-weight:500">' + x[1] + '</span></li>'; }).join('') +
         '</ul></div>';

    // Timeline
    h += '<div class="panel"><div class="panel-head"><h3>Steps</h3></div><ol class="list-plain">';
    d.steps.forEach(function (s) {
      const dot = s.done ? (s.late ? 'var(--amber)' : 'var(--green)') : (s.isCurrent && !d.cancelled ? 'var(--brand)' : 'var(--border-strong)');
      const fields = Object.keys(s.fields || {}).filter(function (k) { return s.fields[k]; })
        .map(function (k) { return (FIELD_LABEL[k] || k) + ': ' + A.esc(s.fields[k]); });
      let sub = '';
      if (s.done) {
        sub = A.esc(s.actual) + (s.doneBy ? ' · ' + A.esc(s.doneBy) : '') +
              (s.enteredBy ? ' (entry: ' + A.esc(s.enteredBy) + ')' : '') +
              (s.status && s.status !== 'Done' ? ' · ' + A.esc(s.status) : '');
      } else if (s.isCurrent && !d.cancelled) {
        sub = 'Abhi yahan · deadline ' + A.esc(s.planned || '-');
      } else {
        sub = 'Baaki';
      }
      h += '<li style="display:flex;gap:12px;align-items:flex-start">' +
           '<span style="width:12px;height:12px;border-radius:50%;margin-top:5px;flex:none;background:' + dot + '"></span>' +
           '<div style="min-width:0;flex:1">' +
             '<div class="row between"><b style="font-weight:600">' + A.esc(s.label) + '</b>' +
               (s.done && s.late ? '<span class="pill yellow">Late</span>' : '') + '</div>' +
             '<div class="muted small">' + sub + '</div>' +
             (fields.length ? '<div class="small" style="margin-top:2px">' + fields.join(' · ') + '</div>' : '') +
             (s.lateReason ? '<div class="small" style="color:var(--amber);margin-top:2px">Late: ' + A.esc(s.lateReason) + '</div>' : '') +
             (s.photos && s.photos.length ? '<div class="small" style="margin-top:2px">' + links(s.photos) + '</div>' : '') +
           '</div></li>';
    });
    h += '</ol></div>';

    // Activity log
    const extra = (d.history || []).filter(function (x) { return x.kaam === 'Galti mili' || x.kaam === 'Order Cancel' || x.kaam === 'Parchi photo jodi'; });
    if (extra.length) {
      h += '<div class="panel"><div class="panel-head"><h3>Aur jaankari</h3></div><ul class="list-plain">' +
           extra.map(function (x) {
             return '<li><div class="row between"><b style="font-weight:600">' + A.esc(x.kaam) + '</b><span class="muted small">' + A.esc(x.time) + '</span></div>' +
                    '<div class="small">' + A.esc(x.details) + ' — ' + A.esc(x.doneBy) + '</div></li>';
           }).join('') + '</ul></div>';
    }

    // Buttons
    if (d.canAct && A.screens.step) h += '<button class="btn btn-go btn-block" id="od-act">"' + A.esc(d.currentLabel) + '" bharo</button>';
    if (A.staff.isDirector && !d.cancelled) h += '<div class="mt"></div><button class="btn btn-danger btn-block" id="od-cancel">Order cancel karo</button>';

    view.innerHTML = h;
    A.$('#od-back', view).onclick = function () { A.go(back); };
    const act = A.$('#od-act', view);
    if (act) act.onclick = function () { A.lastStep = d.currentStep; A.go('step', { orderId: d.orderId, stepKey: d.currentStep }); };
    const cancel = A.$('#od-cancel', view);
    if (cancel) cancel.onclick = function () {
      A.sheet('<h3>' + A.esc(d.orderId) + ' cancel karna hai?</h3>' +
        '<p class="muted" style="margin-top:0">Cancel order kisi list mein nahi dikhega. Sheet mein row waise hi rahegi.</p>' +
        '<div class="field"><label>Cancel kyun? <span class="req">*</span></label>' +
        '<textarea class="textarea" id="c-why" placeholder="Jaise: Customer ne order wapas liya"></textarea></div>' +
        '<div class="btn-row"><button class="btn btn-ghost" id="c-no">Rehne do</button><button class="btn btn-danger" id="c-yes">Haan, cancel karo</button></div>',
        function (el, close) {
          A.$('#c-no', el).onclick = close;
          A.$('#c-yes', el).onclick = function () {
            A.call('cancelOrder', { orderId: d.orderId, reason: A.$('#c-why', el).value }, 'Cancel ho raha hai...')
              .then(function () { close(); A.cacheDropOrder(d.orderId); A.toast(d.orderId + ' cancel ho gaya.', 'ok'); A.go('orderDetail', params); })
              .catch(function () {});
          };
        });
    };
  }

})(window.O2D);
</script>

  <!--
  ============================================================
   Screen_Dashboard.html  —  Director / PC Dashboard
  ============================================================
   Ek nazar mein poora kaam:
   1. Upar 4 number: chalu orders, late orders, aaj aaye, aaj dispatch
   2. Kaun sa step kahan atka hai (har step pe kaun hai, kitne pending,
      kitne late) — sabse zyada atka step saaf dikhe
   3. Late orders ki list (tap → order ki kahani)
   4. Staff ka on-time % + Performance (sabse kamzor upar):
        90% ya zyada   → Excellent (hara)
        75% – 89%      → Good      (neela)
        50% – 74%      → Bad       (peela)
        50% se kam     → Poor      (laal)
   5. Late hone ki wajahein
   6. Order se dispatch tak ka average time
   Samay chuno: Aaj / 1 Hafta / 1 Mahina / 3 Mahine / Apni date
   (apni date = kis din se kis din tak). Har 60 second mein taaza.
  ============================================================
-->
<script>
(function (A) {
  'use strict';

  let timer = null;

  function bar(value, max, color) {
    const pct = max ? Math.round((value / max) * 100) : 0;
    return '<div style="height:8px;background:var(--grey-bg);border-radius:4px;overflow:hidden;min-width:60px">' +
           '<div style="height:100%;width:' + pct + '%;background:' + color + '"></div></div>';
  }

  /** On-time % → Excellent / Good / Bad / Poor */
  function grade(pct) {
    if (pct >= 90) return { label: 'Excellent', cls: 'green' };
    if (pct >= 75) return { label: 'Good', cls: 'wait' };
    if (pct >= 50) return { label: 'Bad', cls: 'yellow' };
    return { label: 'Poor', cls: 'red' };
  }

  A.screens.dashboard = {
    render: function (view) {
      clearInterval(timer);

      // Samay — phone pichla chuna hua yaad rakhta hai
      const PRESETS = [
        { key: '1', label: 'Aaj', days: 1 },
        { key: '7', label: '1 Hafta', days: 7 },
        { key: '30', label: '1 Mahina', days: 30 },
        { key: '90', label: '3 Mahine', days: 90 },
        { key: 'custom', label: 'Apni date' }
      ];
      let pick = '30', fromVal = '', toVal = '';
      try { pick = localStorage.getItem('o2d_dash_pick') || '30'; } catch (e) {}
      if (!PRESETS.some(function (x) { return x.key === pick; })) pick = '30';

      function ymd(d) {
        return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
      }
      const todayStr = ymd(new Date());
      toVal = todayStr;
      fromVal = ymd(new Date(Date.now() - 29 * 86400000));

      view.innerHTML =
        A.pageHead('Dashboard', 'Load ho raha hai...') +
        '<div class="panel" style="padding:12px 14px">' +
          '<div class="choices" id="db-days" style="flex-wrap:wrap">' +
            PRESETS.map(function (x) { return '<button type="button" class="choice' + (x.key === pick ? ' on' : '') + '" data-k="' + x.key + '">' + x.label + '</button>'; }).join('') +
          '</div>' +
          '<div id="db-custom" class="row" style="gap:10px;flex-wrap:wrap;align-items:flex-end;margin-top:12px;' + (pick === 'custom' ? '' : 'display:none') + '">' +
            '<div class="field" style="margin:0;flex:1;min-width:140px"><label for="db-from">Kis din se</label><input class="input" type="date" id="db-from" max="' + todayStr + '" value="' + fromVal + '"></div>' +
            '<div class="field" style="margin:0;flex:1;min-width:140px"><label for="db-to">Kis din tak</label><input class="input" type="date" id="db-to" max="' + todayStr + '" value="' + toVal + '"></div>' +
            '<button type="button" class="btn btn-main" id="db-go">Dekho</button>' +
          '</div>' +
        '</div>' +
        '<div id="db-body"></div>';

      A.$$('#db-days .choice', view).forEach(function (b) {
        b.onclick = function () {
          pick = b.getAttribute('data-k');
          try { localStorage.setItem('o2d_dash_pick', pick); } catch (e) {}
          A.$$('#db-days .choice', view).forEach(function (x) { x.classList.toggle('on', x === b); });
          A.$('#db-custom', view).style.display = pick === 'custom' ? '' : 'none';
          if (pick !== 'custom') load(true);
        };
      });
      A.$('#db-go', view).onclick = function () {
        const f = A.$('#db-from', view).value, t = A.$('#db-to', view).value;
        if (!f || !t) return A.toast('Dono date chuno.', 'err');
        if (f > t) return A.toast('"Kis din se" wali date pehle ki honi chahiye.', 'err');
        fromVal = f; toVal = t;
        load(true);
      };

      function period() {
        if (pick === 'custom') return { from: fromVal, to: toVal };
        return { days: (PRESETS.filter(function (x) { return x.key === pick; })[0] || {}).days || 30 };
      }

      function load(showLoader) {
        if (A.current !== 'dashboard') { clearInterval(timer); return; }
        A.fast('dashboard', period(), draw, 'Dashboard taiyar ho raha hai...', showLoader)
          .catch(function (e) { if (showLoader) A.$('#db-body', view).innerHTML = '<div class="note err">' + A.esc(e.message) + '</div>'; });
      }

      function draw(d) {
        if (A.current !== 'dashboard') return;
        const s = d.summary;
        A.redCount = s.red;
        A.drawTabs();
        A.$('.screen-sub', view).textContent = (d.periodLabel || '') + ' · Taaza: ' + d.at;

        let h = '<div class="kpis">' +
          kpi('Chalu orders', s.running, '') +
          kpi('Late orders', s.red, s.red ? 'red' : '') +
          kpi('Aaj aaye', s.todayOrders, '') +
          kpi('Aaj dispatch', s.todayDispatch, 'green') +
          '</div>';

        // ---- Step board ----
        const maxT = Math.max.apply(null, d.steps.map(function (x) { return x.total; }).concat([1]));
        h += '<div class="panel"><div class="panel-head"><h3>Kaun sa step kahan atka hai</h3></div>' +
          '<div class="table-wrap"><table class="tbl"><thead><tr><th>Step</th><th>Kiske paas</th><th class="num">Pending</th><th class="num">Late</th><th></th></tr></thead><tbody>' +
          d.steps.map(function (x) {
            return '<tr><td><b style="font-weight:600">' + A.esc(x.label) + '</b></td>' +
              '<td class="muted">' + A.esc(x.who) + '</td>' +
              '<td class="num">' + x.total + (x.wait ? ' <span class="muted small">(' + x.wait + ' intezaar)</span>' : '') + '</td>' +
              '<td class="num" style="color:' + (x.red ? 'var(--red)' : 'var(--text-3)') + '">' + x.red + '</td>' +
              '<td style="width:30%">' + bar(x.total, maxT, x.red ? 'var(--red)' : 'var(--brand)') + '</td></tr>';
          }).join('') +
          '</tbody></table></div></div>';

        // ---- Late orders ----
        h += '<div class="panel"><div class="panel-head"><h3>Late orders</h3><span class="count">' + d.redList.length + '</span></div>' +
          (d.redList.length
            ? '<div id="db-red">' + d.redList.map(function (c) {
                return A.slipHtml(c, '<span>' + A.esc(c.stepLabel) + '</span><span>Deadline: ' + A.esc(c.deadline) + '</span>');
              }).join('') + '</div>'
            : '<div class="empty" style="padding:20px"><b>Koi order late nahi</b>Sab time pe chal raha hai.</div>') +
          '</div>';

        // ---- Staff ----
        const COLS = { green: 'var(--green)', wait: 'var(--blue)', yellow: 'var(--amber)', red: 'var(--red)' };
        const gCount = { Excellent: 0, Good: 0, Bad: 0, Poor: 0 };
        d.staff.forEach(function (p) { if (p.done) gCount[grade(p.onTimePct).label]++; });
        h += '<div class="panel"><div class="panel-head"><h3>Staff Performance (' + A.esc(d.periodLabel || d.days + ' din') + ')</h3>' +
          (d.staff.length
            ? '<div class="row" style="gap:6px;flex-wrap:wrap">' +
                ['Excellent', 'Good', 'Bad', 'Poor'].filter(function (k) { return gCount[k]; }).map(function (k) {
                  return '<span class="pill ' + grade({ Excellent: 95, Good: 80, Bad: 60, Poor: 0 }[k]).cls + '">' + gCount[k] + ' ' + k + '</span>';
                }).join('') + '</div>'
            : '') +
          '</div>' +
          (d.staff.length
            ? '<div class="table-wrap"><table class="tbl"><thead><tr><th>Staff</th><th>Performance</th><th class="num">Kaam kiya</th><th class="num">Late</th><th class="num">Time pe</th><th></th></tr></thead><tbody>' +
              d.staff.map(function (p) {
                if (!p.done) {
                  return '<tr><td><b style="font-weight:600">' + A.esc(p.name) + '</b></td>' +
                    '<td><span class="pill" style="background:var(--grey-bg);color:var(--text-2)">Abhi kaam nahi</span></td>' +
                    '<td class="num">0</td><td class="num">0</td><td class="num muted">—</td><td></td></tr>';
                }
                const g = grade(p.onTimePct);
                const col = COLS[g.cls];
                return '<tr><td><b style="font-weight:600">' + A.esc(p.name) + '</b></td>' +
                  '<td><span class="pill ' + g.cls + '">' + g.label + '</span></td>' +
                  '<td class="num">' + p.done + '</td>' +
                  '<td class="num">' + p.late + '</td><td class="num" style="color:' + col + '">' + p.onTimePct + '%</td>' +
                  '<td style="width:24%">' + bar(p.onTimePct, 100, col) + '</td></tr>';
              }).join('') + '</tbody></table></div>' +
              '<p class="muted small" style="margin:10px 0 0">Time pe kaam: 90%+ Excellent · 75–89% Good · 50–74% Bad · 50% se kam Poor. Naam Staff tab se aate hain (test order ka kaam nahi gina jaata).</p>'
            : '<div class="empty" style="padding:20px"><b>Abhi data nahi</b>Steps hone ke baad yahan dikhega.</div>') +
          '</div>';

        // ---- Late reasons + avg ----
        const maxR = Math.max.apply(null, d.lateReasons.map(function (r) { return r.count; }).concat([1]));
        h += '<div class="panel"><div class="panel-head"><h3>Late hone ki wajahein</h3></div>' +
          (d.lateReasons.length
            ? '<ul class="list-plain">' + d.lateReasons.map(function (r) {
                return '<li><div class="row between"><span>' + A.esc(r.reason) + '</span><b>' + r.count + '</b></div>' + bar(r.count, maxR, 'var(--amber)') + '</li>';
              }).join('') + '</ul>'
            : '<div class="muted">Koi late nahi hua.</div>') +
          '</div>';

        h += '<div class="panel row between"><span class="muted">Order se dispatch tak average (sirf kaam ke ghante)</span>' +
             '<b style="font-size:18px">' + A.esc(s.avgOrderToDispatch) + '</b></div>' +
             '<p class="muted small">' + s.completeInPeriod + ' order complete hue (' + A.esc(d.periodLabel || d.days + ' din') + ').</p>';

        A.$('#db-body', view).innerHTML = h;
        A.$$('#db-red .slip', view).forEach(function (b) {
          b.onclick = function () { A.go('orderDetail', { orderId: b.getAttribute('data-oid'), back: 'dashboard' }); };
        });
      }

      function kpi(label, val, cls) {
        return '<div class="kpi ' + cls + '"><div class="k-label">' + A.esc(label) + '</div><div class="k-val">' + A.esc(val) + '</div></div>';
      }

      load(true);
      timer = setInterval(function () { load(false); }, 60000);
    }
  };

})(window.O2D);
</script>

  <!--
  ============================================================
   Screen_Staff.html  —  Staff sambhalo (sirf Director)
  ============================================================
   "Aur" → "Staff sambhalo" se khulta hai.
   - Har staff: role, kaunse steps, Active, PIN set hai ya nahi
   - Naya staff jodo / badlo (role, phone, steps pe tick, Active)
   - PIN set karo (4 ank)
   - Link: copy karo ya seedha WhatsApp pe bhejo
   - "Link badlo" — naya link banta hai, purana turant band
     (staff ne kaam chhoda, ya link kisi aur ke paas chala gaya)
   Badlav hote hi Staff tab aur BMP ki "Who" row update.
  ============================================================
-->
<script>
(function (A) {
  'use strict';

  A.screens.staff = {
    render: function (view) {
      if (!A.staff.isDirector) {
        view.innerHTML = '<div class="note err">Yeh page sirf Director ke liye hai.</div>';
        return;
      }
      view.innerHTML = A.pageHead('Staff', 'Load ho raha hai...',
        '<button class="btn btn-main btn-sm" id="st-add">+ Naya staff</button>') + '<div id="st-list"></div>';
      A.$('#st-add', view).onclick = function () { edit(null); };
      load();

      function load() {
        A.call('staffOverview', {}, 'Staff la rahe hain...')
          .then(draw)
          .catch(function (e) { A.$('#st-list', view).innerHTML = '<div class="note err">' + A.esc(e.message) + '</div>'; });
      }

      function draw(list) {
        A.$('.screen-sub', view).textContent = list.filter(function (s) { return s.active; }).length + ' active staff';
        A.$('#st-list', view).innerHTML = list.map(function (s, i) {
          return '<div class="panel" style="opacity:' + (s.active ? 1 : .6) + '">' +
            '<div class="row between" style="align-items:flex-start;gap:8px">' +
              '<div style="min-width:0"><b style="font-size:16px;font-weight:600">' + A.esc(s.name) + '</b>' +
                '<div class="muted small">' + A.esc(s.role) + (s.phone ? ' · ' + A.esc(s.phone) : '') + '</div></div>' +
              '<div class="row" style="gap:6px;flex-wrap:wrap;justify-content:flex-end">' +
                (s.active ? '<span class="pill green">Active</span>' : '<span class="pill">Band</span>') +
                (s.pinSet ? '<span class="pill done">PIN set</span>' : '<span class="pill yellow">PIN nahi</span>') +
              '</div>' +
            '</div>' +
            '<div class="small mt" style="margin-top:8px">' + A.esc(s.stepLabels.join(', ') || '-') + '</div>' +
            '<div class="row mt" style="gap:8px;flex-wrap:wrap">' +
              '<button class="btn btn-ghost btn-sm" data-a="edit" data-i="' + i + '">Badlo</button>' +
              '<button class="btn btn-ghost btn-sm" data-a="pin" data-i="' + i + '">PIN set karo</button>' +
              (s.link ? '<button class="btn btn-ghost btn-sm" data-a="share" data-i="' + i + '">Link bhejo</button>' : '') +
              '<button class="btn btn-ghost btn-sm" data-a="newlink" data-i="' + i + '">Link badlo</button>' +
            '</div>' +
          '</div>';
        }).join('');

        A.$$('[data-a]', view).forEach(function (b) {
          const s = list[parseInt(b.getAttribute('data-i'), 10)];
          b.onclick = function () {
            const a = b.getAttribute('data-a');
            if (a === 'edit') edit(s);
            if (a === 'pin') setPin(s);
            if (a === 'share') share(s);
            if (a === 'newlink') newLink(s);
          };
        });
      }

      /* ---- Naya / badlo ---- */
      function edit(s) {
        const isNew = !s;
        s = s || { name: '', role: 'Staff', phone: '', steps: [], active: true, note: '' };
        const steps = (A.config.steps || []);
        A.sheet(
          '<h3>' + (isNew ? 'Naya staff' : A.esc(s.name)) + '</h3>' +
          (isNew ? '<div class="field"><label>Naam <span class="req">*</span></label><input class="input" id="e-name" placeholder="Jaise: Ramesh">' +
                   '<div class="hint">Naam baad mein nahi badlega — purane record isi naam se rahenge.</div></div>' : '') +
          '<div class="field"><label>Role</label><div class="choices" id="e-role">' +
            A.config.roles.map(function (r) { return '<button type="button" class="choice' + (r === s.role ? ' on' : '') + '" data-v="' + A.esc(r) + '">' + A.esc(r) + '</button>'; }).join('') +
          '</div><div class="hint">Director / PC = har step kar sakte hain.</div></div>' +
          '<div class="field" id="e-steps-f"><label>Kaunse kaam karega?</label><div class="choices" id="e-steps">' +
            steps.map(function (st) { return '<button type="button" class="choice' + (s.steps.indexOf(st.key) >= 0 ? ' on' : '') + '" data-v="' + st.key + '">' + A.esc(st.label) + '</button>'; }).join('') +
          '</div></div>' +
          '<div class="field"><label>Phone</label><input class="input" id="e-phone" type="tel" inputmode="numeric" value="' + A.esc(s.phone) + '" placeholder="10 ank (WhatsApp ke liye)"></div>' +
          '<div class="field"><label>Note</label><input class="input" id="e-note" value="' + A.esc(s.note || '') + '"></div>' +
          '<div class="field"><label class="row" style="gap:10px;cursor:pointer"><input type="checkbox" id="e-active" style="width:20px;height:20px"' + (s.active ? ' checked' : '') + '> Active (link chalu)</label></div>' +
          '<button class="btn btn-main btn-block" id="e-save">Save karo</button>',
          function (el, close) {
            let role = s.role;
            const picked = s.steps.slice();
            function syncRole() { A.$('#e-steps-f', el).classList.toggle('hide', role !== 'Staff'); }
            A.$$('#e-role .choice', el).forEach(function (b) {
              b.onclick = function () { role = b.getAttribute('data-v'); A.$$('#e-role .choice', el).forEach(function (x) { x.classList.toggle('on', x === b); }); syncRole(); };
            });
            A.$$('#e-steps .choice', el).forEach(function (b) {
              b.onclick = function () {
                const k = b.getAttribute('data-v'), i = picked.indexOf(k);
                if (i >= 0) picked.splice(i, 1); else picked.push(k);
                b.classList.toggle('on', i < 0);
              };
            });
            syncRole();
            A.$('#e-save', el).onclick = function () {
              A.call('saveStaff', {
                isNew: isNew,
                name: isNew ? A.$('#e-name', el).value : s.name,
                role: role, steps: role === 'Staff' ? picked : [],
                phone: A.$('#e-phone', el).value, note: A.$('#e-note', el).value,
                active: A.$('#e-active', el).checked
              }, 'Save ho raha hai...')
                .then(function () { close(); A.toast('Save ho gaya.', 'ok'); load(); })
                .catch(function () {});
            };
          });
      }

      /* ---- PIN ---- */
      function setPin(s) {
        A.sheet('<h3>' + A.esc(s.name) + ' ka PIN</h3>' +
          '<div class="field"><label>Naya PIN (4 ank)</label><input class="input pin-input" id="n-pin" inputmode="numeric" maxlength="4" style="margin-top:0">' +
          '<div class="hint">0000, 1234 jaisa aasaan PIN nahi chalega. Staff ko yeh PIN bata dena.</div></div>' +
          '<button class="btn btn-main btn-block" id="n-save">PIN set karo</button>',
          function (el, close) {
            A.$('#n-save', el).onclick = function () {
              A.call('setPin', { name: s.name, pin: A.$('#n-pin', el).value }, 'PIN set ho raha hai...')
                .then(function (r) { close(); A.toast(r.message, 'ok'); load(); })
                .catch(function () {});
            };
          });
      }

      /* ---- Link bhejo ---- */
      function share(s) {
        const msg = 'Namaste ' + s.name + ',\nRK Garg Jeans — Order To Dispatch app ka aapka link:\n' + s.link +
                    '\n\nLink kholke apna 4 ank ka PIN daalo. Yeh link kisi aur ko mat bhejna.';
        const wa = 'https://wa.me/' + (s.phone ? '91' + s.phone : '') + '?text=' + encodeURIComponent(msg);
        A.sheet('<h3>' + A.esc(s.name) + ' ka link</h3>' +
          '<div class="field"><input class="input" id="l-url" readonly value="' + A.esc(s.link) + '"></div>' +
          '<div class="btn-row"><button class="btn btn-ghost" id="l-copy">Copy karo</button>' +
          '<a class="btn btn-go" href="' + A.esc(wa) + '" target="_blank" rel="noopener">WhatsApp pe bhejo</a></div>' +
          (s.pinSet ? '' : '<div class="note warn mt" style="margin-bottom:0">Iska PIN abhi set nahi hai — pehle PIN set karo.</div>'),
          function (el) {
            A.$('#l-copy', el).onclick = function () {
              const inp = A.$('#l-url', el);
              inp.select();
              try { navigator.clipboard.writeText(inp.value); } catch (e) { document.execCommand('copy'); }
              A.toast('Link copy ho gaya.', 'ok');
            };
          });
      }

      /* ---- Naya link ---- */
      function newLink(s) {
        A.sheet('<h3>' + A.esc(s.name) + ' ka link badlein?</h3>' +
          '<p class="muted" style="margin-top:0">Iska istemaal tab karo jab staff kaam chhod de, ya link kisi aur ke paas chala jaye. Purana link turant band ho jayega aur naya link banega — sahi staff ko naya link "Link bhejo" se dobara bhejna padega.</p>' +
          '<div class="btn-row"><button class="btn btn-ghost" id="k-no">Rehne do</button><button class="btn btn-main" id="k-yes">Haan, link badlo</button></div>',
          function (el, close) {
            A.$('#k-no', el).onclick = close;
            A.$('#k-yes', el).onclick = function () {
              A.call('newLink', { name: s.name }, 'Naya link ban raha hai...')
                .then(function () { close(); A.toast('Naya link ban gaya.', 'ok'); load(); })
                .catch(function () {});
            };
          });
      }
    }
  };

})(window.O2D);
</script>


  <script>
    window.addEventListener('load', function () {
      if (window.O2D_CONFIG_ERROR) { document.getElementById('view').innerHTML = '<div class="note err">' + window.O2D_CONFIG_ERROR + '</div>'; return; }
      O2D.start();
    });
  </script>
</body>
