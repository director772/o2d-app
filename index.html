<!DOCTYPE html>
<!--
  ============================================================
   Page_App.html  —  App ka dhaancha (yahi page khulta hai)
  ============================================================
   - Upar: RK Garg Jeans + login wale staff ka naam
   - Beech: screen (Login / Mera Kaam / Naya Order ...)
   - Neeche: tabs (staff ke role ke hisaab se)

   Screens alag files mein hain (Screen_...). Jo file abhi nahi
   bani, woh apne aap chhoot jaati hai — app phir bhi khulega.
   Nayi screen file Apps Script mein jodte hi app mein aa jayegi,
   is file ko badalne ki zaroorat nahi.
  ============================================================
-->
<html lang="hi">
<head>
  
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="theme-color" content="#1E3A5F">
  <title>RK Garg Jeans — Order To Dispatch</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <!--
  ============================================================
   Design_Style.html  —  O2D Web App ka rang-roop (CSS)
  ============================================================
   Company software jaisa saaf, professional look:
   - Safed panels, patli border, halki shadow
   - Computer pe LEFT menu (sidebar), phone pe NEECHE tabs
   - Navy blue company rang, status ke liye laal / peela / hara / neela
   - Inter font, numbers seedhi line mein
  ============================================================
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
  :root {
    /* Company */
    --brand: #1E3A5F;
    --brand-dark: #152A45;
    --brand-tint: #EEF3F9;
    --gold: #C9962B;

    /* Surface */
    --bg: #F3F5F8;
    --surface: #FFFFFF;
    --border: #E1E6EC;
    --border-strong: #CBD3DD;

    /* Text */
    --text: #1A2433;
    --text-2: #536173;
    --text-3: #8A96A6;

    /* Status */
    --red: #C5221F;    --red-bg: #FCEBEA;
    --amber: #B06F00;  --amber-bg: #FFF4DC;
    --green: #18794E;  --green-bg: #E5F4EC;
    --blue: #1D63C9;   --blue-bg: #E7F0FD;
    --grey: #6B7684;   --grey-bg: #EEF1F4;

    --radius: 8px;
    --radius-lg: 12px;
    --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
    --tap: 48px;
    --side: 232px;
    --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.5;
    color: var(--text);
    background: var(--bg);
    font-feature-settings: 'tnum' 1, 'cv11' 1;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    padding-bottom: calc(68px + env(safe-area-inset-bottom));
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  /* ============ TOP BAR ============ */
  .topbar {
    position: sticky; top: 0; z-index: 30;
    height: 60px; display: flex; align-items: center; gap: 12px;
    padding: 0 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .logo {
    width: 36px; height: 36px; border-radius: 8px; flex: none;
    background: var(--brand); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px; letter-spacing: .5px;
    box-shadow: inset 0 -3px 0 var(--gold);
  }
  .brand { line-height: 1.15; min-width: 0; }
  .brand b { display: block; font-size: 15px; font-weight: 700; color: var(--brand); white-space: nowrap; }
  .brand small { display: block; font-size: 12px; color: var(--text-2); white-space: nowrap; }
  .topbar .spacer { flex: 1; }
  .who {
    display: flex; align-items: center; gap: 8px; max-width: 50%;
    border: 1px solid var(--border); background: var(--surface);
    border-radius: 999px; padding: 4px 12px 4px 4px; cursor: pointer;
  }
  .who:empty { display: none; }
  .who .av {
    width: 28px; height: 28px; border-radius: 50%; flex: none;
    background: var(--brand-tint); color: var(--brand);
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px;
  }
  .who .nm { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who .rl { font-size: 11px; color: var(--text-3); white-space: nowrap; }
  .who .tx { line-height: 1.15; text-align: left; min-width: 0; }

  /* ============ MAIN ============ */
  #view { max-width: 980px; margin: 0 auto; padding: 20px 16px; }
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .screen-title { font-size: 22px; font-weight: 700; margin: 0; letter-spacing: -.2px; }
  .screen-sub { color: var(--text-2); margin: 2px 0 0; font-size: 14px; }

  .panel {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); box-shadow: var(--shadow);
    padding: 16px; margin-bottom: 16px;
  }
  .panel-head { display: flex; align-items: center; justify-content: space-between; margin: -2px 0 12px; }
  .panel-head h3 { margin: 0; font-size: 15px; font-weight: 600; }

  /* ============ NAVIGATION ============ */
  /* Phone: neeche tabs */
  .tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    display: flex; justify-content: space-around;
    background: var(--surface); border-top: 1px solid var(--border);
    padding: 4px 4px calc(4px + env(safe-area-inset-bottom));
  }
  .tabs:empty { display: none; }
  .tab {
    flex: 1; min-height: 56px; border: 0; background: none; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    color: var(--text-3); font-size: 11.5px; font-weight: 600; border-radius: var(--radius);
    position: relative;
  }
  .tab svg { width: 22px; height: 22px; }
  .tab.active { color: var(--brand); }
  .tab.active::before {
    content: ''; position: absolute; top: -4px; left: 28%; right: 28%; height: 3px;
    background: var(--brand); border-radius: 0 0 3px 3px;
  }
  .tab .badge {
    position: absolute; top: 5px; left: calc(50% + 6px);
    background: var(--red); color: #fff; font-size: 10.5px; font-weight: 700; line-height: 17px;
    min-width: 17px; padding: 0 5px; border-radius: 9px; text-align: center;
  }

  /* Computer: left menu */
  @media (min-width: 900px) {
    body { padding-bottom: 0; padding-left: var(--side); }
    .topbar { margin-left: calc(-1 * var(--side)); padding-left: 20px; }
    .tabs {
      top: 60px; bottom: 0; left: 0; right: auto; width: var(--side);
      flex-direction: column; justify-content: flex-start; gap: 2px;
      border-top: 0; border-right: 1px solid var(--border); padding: 16px 12px;
    }
    .tab {
      flex: none; min-height: 42px; flex-direction: row; justify-content: flex-start; gap: 12px;
      padding: 0 12px; font-size: 14px; color: var(--text-2);
    }
    .tab:hover { background: var(--bg); }
    .tab.active { background: var(--brand-tint); color: var(--brand); }
    .tab.active::before { top: 8px; bottom: 8px; left: -12px; right: auto; width: 3px; height: auto; border-radius: 0 3px 3px 0; }
    .tab .badge { position: static; margin-left: auto; }
    #view { padding: 28px 32px; }
  }

  /* ============ BUTTONS ============ */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: var(--tap); padding: 0 18px; border: 1px solid transparent; border-radius: var(--radius);
    font-weight: 600; font-size: 15px; cursor: pointer; user-select: none; white-space: nowrap;
    transition: background .12s, border-color .12s;
  }
  .btn[disabled] { opacity: .5; pointer-events: none; }
  .btn-main { background: var(--brand); color: #fff; }
  .btn-main:hover { background: var(--brand-dark); }
  .btn-go { background: var(--green); color: #fff; }
  .btn-go:hover { filter: brightness(.95); }
  .btn-warn { background: var(--amber-bg); color: var(--amber); border-color: #F1D59A; }
  .btn-danger { background: var(--surface); color: var(--red); border-color: #F2C3C0; }
  .btn-ghost { background: var(--surface); color: var(--text); border-color: var(--border-strong); }
  .btn-ghost:hover { background: var(--bg); }
  .btn-sm { min-height: 36px; padding: 0 12px; font-size: 13.5px; }
  .btn-block { width: 100%; }
  .btn-row { display: flex; gap: 10px; }
  .btn-row > .btn { flex: 1; }

  /* ============ FORM ============ */
  .field { margin-bottom: 16px; }
  .field > label { display: block; font-weight: 600; font-size: 13.5px; margin-bottom: 6px; color: var(--text); }
  .field .req { color: var(--red); margin-left: 2px; }
  .field .hint { font-size: 12.5px; color: var(--text-2); margin-top: 5px; }
  .input, .select, .textarea {
    width: 100%; min-height: var(--tap); padding: 10px 12px;
    border: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--surface);
    font-size: 15px; transition: border-color .12s, box-shadow .12s;
  }
  .textarea { min-height: 88px; resize: vertical; }
  .input:focus, .select:focus, .textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(30,58,95,.12); outline: none; }
  .form-grid { display: grid; grid-template-columns: 1fr; gap: 0 16px; }
  @media (min-width: 700px) { .form-grid { grid-template-columns: 1fr 1fr; } .form-grid .full { grid-column: 1 / -1; } }

  .choices { display: flex; flex-wrap: wrap; gap: 8px; }
  .choice {
    min-height: 42px; padding: 8px 14px; border: 1px solid var(--border-strong); border-radius: var(--radius);
    background: var(--surface); font-weight: 500; font-size: 14px; cursor: pointer;
  }
  .choice:hover { border-color: var(--brand); }
  .choice.on { border-color: var(--brand); background: var(--brand-tint); color: var(--brand); font-weight: 600; box-shadow: inset 0 0 0 1px var(--brand); }

  .yesno { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .yesno .choice { min-height: 64px; font-size: 17px; font-weight: 700; }
  .yesno .choice.on.yes { border-color: var(--green); background: var(--green-bg); color: var(--green); box-shadow: inset 0 0 0 1px var(--green); }
  .yesno .choice.on.no  { border-color: var(--red); background: var(--red-bg); color: var(--red); box-shadow: inset 0 0 0 1px var(--red); }

  /* ============ PHOTO ============ */
  .photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; }
  .photo-thumb, .photo-add { aspect-ratio: 1; border-radius: var(--radius); position: relative; overflow: hidden; }
  .photo-thumb { border: 1px solid var(--border); background: var(--grey-bg); }
  .photo-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-thumb .pdf { display: flex; height: 100%; align-items: center; justify-content: center; font-weight: 700; color: var(--red); }
  .photo-thumb .x {
    position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border-radius: 50%;
    border: 0; background: rgba(16,24,40,.65); color: #fff; font-size: 15px; line-height: 26px; cursor: pointer;
  }
  .photo-add {
    border: 1.5px dashed var(--border-strong); background: var(--surface);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    color: var(--brand); font-size: 12px; font-weight: 600; cursor: pointer; text-align: center; padding: 4px;
  }
  .photo-add:hover { border-color: var(--brand); background: var(--brand-tint); }
  .photo-add svg { width: 24px; height: 24px; }
  .photo-add input { display: none; }

  /* ============ ORDER CARD ============ */
  .slip {
    position: relative; display: block; width: 100%; text-align: left; cursor: pointer;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
    box-shadow: var(--shadow); padding: 14px 16px 14px 18px; margin-bottom: 10px;
    overflow: hidden; transition: border-color .12s;
  }
  .slip:hover { border-color: var(--border-strong); }
  .slip::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--grey); }
  .slip.red::before    { background: var(--red); }
  .slip.yellow::before { background: var(--amber); }
  .slip.green::before  { background: var(--green); }
  .slip.wait::before   { background: var(--blue); }
  .slip.done::before   { background: var(--brand); }
  .slip-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .oid { font-weight: 600; font-size: 13px; color: var(--text-2); letter-spacing: .2px; }
  .slip-cust { font-weight: 600; font-size: 16px; margin: 4px 0 2px; color: var(--text); }
  .slip-meta { color: var(--text-2); font-size: 13.5px; }
  .slip-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 13px; color: var(--text-2); }

  .pill {
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
    font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
    background: var(--grey-bg); color: var(--grey);
  }
  .pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pill.red    { background: var(--red-bg); color: var(--red); }
  .pill.yellow { background: var(--amber-bg); color: var(--amber); }
  .pill.green  { background: var(--green-bg); color: var(--green); }
  .pill.wait   { background: var(--blue-bg); color: var(--blue); }
  .pill.done   { background: var(--brand-tint); color: var(--brand); }

  .group-head { display: flex; align-items: center; justify-content: space-between; margin: 24px 0 10px; }
  .group-head:first-child { margin-top: 0; }
  .group-head h3 { margin: 0; font-size: 15px; font-weight: 600; }
  .count { font-weight: 600; font-size: 13px; color: var(--text-2); background: var(--grey-bg); padding: 2px 10px; border-radius: 999px; }

  /* ============ KPI + TABLE (dashboard) ============ */
  .kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 16px; }
  @media (min-width: 700px) { .kpis { grid-template-columns: repeat(4, 1fr); } }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow); padding: 14px 16px; }
  .kpi .k-label { font-size: 12.5px; color: var(--text-2); font-weight: 500; }
  .kpi .k-val { font-size: 26px; font-weight: 700; margin-top: 2px; letter-spacing: -.5px; }
  .kpi.red .k-val { color: var(--red); }
  .kpi.green .k-val { color: var(--green); }

  .table-wrap { overflow-x: auto; margin: 0 -16px; padding: 0 16px; }
  table.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
  .tbl th { text-align: left; font-weight: 600; font-size: 12.5px; color: var(--text-2); padding: 8px 10px; border-bottom: 1px solid var(--border); background: var(--bg); white-space: nowrap; }
  .tbl td { padding: 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .tbl tr:last-child td { border-bottom: 0; }
  .tbl .num { text-align: right; font-weight: 600; }

  /* ============ EMPTY / NOTE ============ */
  .empty { text-align: center; color: var(--text-2); padding: 48px 16px; }
  .empty b { display: block; font-size: 16px; color: var(--text); margin-bottom: 4px; font-weight: 600; }
  .note { padding: 12px 14px; border-radius: var(--radius); background: var(--brand-tint); color: var(--brand); margin-bottom: 16px; font-size: 14px; border: 1px solid #D5E0EE; }
  .note.warn { background: var(--amber-bg); color: var(--amber); border-color: #F1D59A; }
  .note.err  { background: var(--red-bg); color: var(--red); border-color: #F2C3C0; }

  /* ============ SHEET (popup) ============ */
  .sheet-bg { position: fixed; inset: 0; background: rgba(16,24,40,.45); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
  .sheet {
    width: 100%; max-width: 560px; max-height: 92vh; overflow: auto;
    background: var(--surface); border-radius: 16px 16px 0 0; padding: 20px 18px calc(20px + env(safe-area-inset-bottom));
    animation: up .16s ease-out;
  }
  .sheet h3 { margin: 0 0 14px; font-size: 18px; font-weight: 700; }
  @media (min-width: 700px) { .sheet-bg { align-items: center; } .sheet { border-radius: 16px; } }
  @keyframes up { from { transform: translateY(24px); opacity: .5; } to { transform: none; opacity: 1; } }

  /* ============ TOAST + LOADER ============ */
  #toast {
    position: fixed; left: 16px; right: 16px; bottom: calc(80px + env(safe-area-inset-bottom)); z-index: 70;
    max-width: 480px; margin: 0 auto; padding: 12px 16px; border-radius: var(--radius);
    background: var(--text); color: #fff; font-weight: 500; font-size: 14px; display: none;
    box-shadow: 0 8px 24px rgba(16,24,40,.2);
  }
  #toast.show { display: block; animation: up .16s ease-out; }
  #toast.ok { background: var(--green); }
  #toast.err { background: var(--red); }
  @media (min-width: 900px) { #toast { bottom: 24px; left: calc(var(--side) + 16px); } }
  #loader { position: fixed; inset: 0; z-index: 80; display: none; align-items: center; justify-content: center; background: rgba(243,245,248,.75); }
  #loader.show { display: flex; }
  .spin { width: 36px; height: 36px; border-radius: 50%; border: 3px solid var(--border); border-top-color: var(--brand); animation: rot .7s linear infinite; }
  #loader .txt { margin-top: 10px; font-weight: 500; font-size: 14px; color: var(--text-2); text-align: center; }
  @keyframes rot { to { transform: rotate(360deg); } }

  /* ============ LOGIN ============ */
  body.is-login { padding-left: 0 !important; padding-bottom: 0; }
  body.is-login .topbar { display: none; }
  .login-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; background: var(--bg); }
  .login-card {
    width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; box-shadow: 0 12px 32px rgba(16,24,40,.08); overflow: hidden;
  }
  .login-top { background: var(--brand); color: #fff; padding: 22px 24px 20px; border-bottom: 3px solid var(--gold); }
  .login-top .logo { background: #fff; color: var(--brand); width: 40px; height: 40px; font-size: 14px; box-shadow: none; margin-bottom: 12px; }
  .login-top b { display: block; font-size: 18px; font-weight: 700; }
  .login-top small { font-size: 13px; opacity: .8; }
  .login-body { padding: 22px 24px 24px; text-align: center; }
  .login-body h2 { margin: 0; font-size: 17px; font-weight: 600; }
  .login-body p { margin: 4px 0 0; color: var(--text-2); font-size: 13.5px; }
  @keyframes shake { 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } }
  .pin-msg { min-height: 20px; color: var(--red); font-weight: 500; font-size: 13.5px; margin: 8px 0 12px; }
  .pin-input {
    width: 100%; height: 56px; text-align: center;
    font-size: 26px; font-weight: 600; letter-spacing: 18px; padding-left: 18px;
    border: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--surface);
    margin-top: 18px;
  }
  .pin-input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(30,58,95,.12); outline: none; }
  .pin-input.shake { animation: shake .35s; border-color: var(--red); }
  .pin-input::placeholder { letter-spacing: 18px; color: var(--border-strong); }
  .login-foot { padding: 14px 24px; border-top: 1px solid var(--border); background: var(--bg); font-size: 12.5px; color: var(--text-2); text-align: center; }

  /* ============ CHHOTE HELPERS ============ */
  .muted { color: var(--text-2); }
  .small { font-size: 13px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .between { justify-content: space-between; }
  .mt { margin-top: 16px; }
  .hide { display: none !important; }
  .list-plain { list-style: none; padding: 0; margin: 0; }
  .list-plain li { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .list-plain li:last-child { border-bottom: 0; }
</style>

</head>
<body>

  <header class="topbar">
    <div class="logo">RKG</div>
    <div class="brand"><b>RK Garg Jeans</b><small>Order To Dispatch</small></div>
    <div class="spacer"></div>
    <button type="button" class="who" id="who" onclick="O2D.go('more')"></button>
  </header>

  <main id="view">
    <div class="empty"><b>Khul raha hai...</b></div>
  </main>

  <nav class="tabs" id="tabs"></nav>

  <div id="toast" role="status" aria-live="polite"></div>
  <div id="loader"><div style="text-align:center"><div class="spin" style="margin:0 auto"></div><div class="txt"></div></div></div>

  <script src="config.js"></script>
  <script>
    window.O2D_LINK = ''; window.O2D_LINK_ERR = ''; window.O2D_URL = ''; window.O2D_NAMES = [];
    if (!window.O2D_API_URL || !/^https:\/\/script\.google\.com\/.+\/exec$/.test(window.O2D_API_URL)) {
      window.O2D_CONFIG_ERROR = 'config.js mein Apps Script ka /exec link sahi nahi hai. GitHub pe config.js kholke link daalo.';
    }
  </script>

  <!--
  ============================================================
   Js_Api.html  —  App ka dimaag (screen wala JavaScript)
  ============================================================
   1. O2D.api(kaam, data) — server se baat karne ka EK hi raasta.
      - Apps Script ke link pe: google.script.run
      - Vercel pe (window.O2D_API_URL set ho): internet se Apps Script
        ke doPost tak. Baaki screens dono jagah same.
      O2D.fast — pichla data turant dikhao, taaza peeche se lao
      (phone mein yaad rehta hai, isliye app turant khulta hai)
   2. Login (naam + PIN) yaad rakhna (phone mein 30 din), logout
   3. Screens ke beech aana-jaana (O2D.go) aur neeche ke tabs
   4. Photo ko chhota karke bhejna (1600px, taaki jaldi upload ho)
      Video tukdon mein (4 MB) Drive tak — progress ke saath
   5. Toast message, loading, "Aur" screen (PIN badlo, logout)
  ============================================================
-->
<script>
window.O2D = window.O2D || {};
(function (A) {
  'use strict';

  A.screens = A.screens || {};
  A.staff = null;
  A.config = null;
  A.current = null;

  /* ---------------- Chhote helpers ---------------- */

  A.$ = function (sel, root) { return (root || document).querySelector(sel); };
  A.$$ = function (sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };
  A.esc = function (s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  };
  A.uid = function () { return Date.now().toString(36) + Math.random().toString(36).slice(2, 10); };

  const store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
  };
  const TOKEN_KEY = 'o2d_token_v1';
  const LINK_KEY = 'o2d_link_code';     // staff ka apna link — phone yaad rakhta hai
  const BOOT_KEY = 'o2d_boot_v1';
  const CACHE_PREFIX = 'o2d_c1_';
  const API_URL = window.O2D_API_URL || '';
  let memToken = '';

  /* ---------------- Toast + loading ---------------- */

  let toastTimer = null;
  A.toast = function (msg, type) {
    const t = A.$('#toast');
    if (!t) return;
    t.textContent = msg;
    t.className = 'show ' + (type || '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.className = ''; }, type === 'err' ? 5000 : 2800);
  };

  A.loading = function (on, text) {
    const l = A.$('#loader');
    if (!l) return;
    A.$('.txt', l).textContent = text || '';
    l.classList.toggle('show', !!on);
  };

  /* ---------------- Login yaad rakhna ---------------- */

  A.token = function () { return memToken || store.get(TOKEN_KEY) || ''; };

  A.setLogin = function (token) {
    memToken = token;
    store.set(TOKEN_KEY, token);
  };

  /** Logout — wapas login window (phone mein rakha purana data bhi saaf) */
  A.clearLogin = function () {
    memToken = '';
    store.del(TOKEN_KEY);
    store.del(BOOT_KEY);
    try {
      Object.keys(localStorage).forEach(function (k) { if (k.indexOf(CACHE_PREFIX) === 0) localStorage.removeItem(k); });
    } catch (e) {}
    A.director = null;
    A.staff = null;
    A.config = null;
  };

  /**
   * Login window kholna. Vercel pe pehle naam ki list server se laate hain
   * (Apps Script wale link pe list page ke saath hi aa jaati hai).
   */
  let loginInfoLoaded = !API_URL;
  A.showLogin = function (msg) {
    A.clearLogin();
    if (loginInfoLoaded) { A.go('login', { msg: msg || '' }); return; }
    // Staff ke apne link (?u=CODE) ka code phone mein yaad — refresh / home-screen
    // icon / logout ke baad bhi sirf usi ka naam aaye
    let code = '';
    try { code = (new URLSearchParams(location.search).get('u') || '').trim().toUpperCase(); } catch (e) {}
    if (code) store.set(LINK_KEY, code);
    else code = store.get(LINK_KEY) || '';
    A.loading(true, 'Khul raha hai...');
    A.api('loginInfo', { code: code })
      .then(function (d) {
        A.loading(false);
        loginInfoLoaded = true;
        window.O2D_NAMES = d.names || [];
        window.O2D_LINK = d.linkCode || '';
        window.O2D_LINK_ERR = d.linkError || '';
        A.go('login', { msg: msg || '' });
      })
      .catch(function (e) {
        A.loading(false);
        A.$('#view').innerHTML = '<div class="note err">' + A.esc(e.message) + '</div>' +
          '<button class="btn btn-main btn-block" onclick="O2D.showLogin()">Dobara try karo</button>';
      });
  };

  /** "Aapka naam" dropdown — is kaam pe tick wale staff */
  A.namesFor = function (stepKey) {
    const s = (A.config && A.config.steps || []).filter(function (x) { return x.key === stepKey; })[0];
    return s ? (s.staffNames || []) : [];
  };

  /** Phone pichli baar is kaam pe chuna naam yaad rakhta hai */
  A.lastName = function (stepKey, value) {
    const k = 'o2d_name_' + stepKey;
    if (value === undefined) return store.get(k) || '';
    store.set(k, value);
  };

  /**
   * "Kaam kisne kiya" dropdown — SIRF Director / PC ke liye
   * (staff ka naam login se apne aap jaata hai, unhe kuch nahi chunna)
   */
  A.nameSelectHtml = function (stepKey, id, label) {
    if (!A.director) return '';
    const names = A.namesFor(stepKey);
    return '<div class="field"><label for="' + id + '">' + A.esc(label || 'Kaam kisne kiya') + '</label>' +
      '<select class="select" id="' + id + '"><option value="">' + A.esc(A.director.name) + ' (main khud)</option>' +
      names.map(function (n) { return '<option value="' + A.esc(n) + '">' + A.esc(n) + '</option>'; }).join('') +
      '</select></div>';
  };

  /** Login wale staff ka yeh kaam hai? */
  A.canDo = function (stepKey) {
    if (!A.staff) return false;
    if (A.staff.isAdmin) return true;
    return (A.staff.steps || []).indexOf(stepKey) >= 0;
  };

  /** Token kis link code ka hai (phone pe kisi aur ka link khula ho toh pata chale) */
  function tokenLinkCode(tok) {
    try {
      const p = String(tok).split('.')[0].replace(/-/g, '+').replace(/_/g, '/');
      const txt = decodeURIComponent(escape(atob(p)));
      return (txt.split('|')[1] || '').toUpperCase();
    } catch (e) { return ''; }
  }

  /* ---------------- SERVER SE BAAT (ek hi raasta) ---------------- */

  A.api = function (action, payload) {
    return new Promise(function (resolve, reject) {
      function handle(r) {
        if (!r) return reject(new Error('Server se jawab nahi aaya. Dobara try karo.'));
        if (r.ok) return resolve(r.data);
        if (r.relogin && action !== 'login' && action !== 'loginLink') A.showLogin(r.error);
        reject(new Error(r.error || 'Kuch galat ho gaya.'));
      }
      function fail(e) {
        const m = String((e && e.message) || e || '');
        if (/network|NetworkError|Failed to fetch|Load failed/i.test(m)) {
          return reject(new Error(API_URL
            ? (navigator.onLine === false
                ? 'Internet nahi chal raha. Net check karke dobara try karo.'
                : 'Server (Apps Script) se jud nahi paaye. Director: Apps Script mein Deploy → "Who has access: Anyone" aur "New version" check karo.')
            : 'Internet nahi chal raha. Net check karke dobara try karo.'));
        }
        reject(new Error(m || 'Kuch galat ho gaya. Dobara try karo.'));
      }

      if (API_URL) {
        // Vercel → Apps Script (text/plain = bina extra "preflight" ke, jaldi)
        const body = JSON.stringify({ token: A.token(), action: action,
          payload: Object.assign({ appUrl: location.origin + '/' }, payload || {}) });
        fetch(API_URL, { method: 'POST', body: body, redirect: 'follow' })
          .then(function (res) {
            if (!res.ok) throw new Error('Server ne mana kar diya (' + res.status + '). Thodi der baad try karo.');
            return res.json().catch(function () {
              throw new Error('Server ka jawab samajh nahi aaya. Apps Script ka "Who has access" = Anyone check karo.');
            });
          })
          .then(handle, fail);
        return;
      }

      google.script.run
        .withSuccessHandler(handle)
        .withFailureHandler(fail)
        .o2dApi(A.token(), action, payload || {});
    });
  };

  /* ---------------- Turant dikhana (pichla data) ---------------- */

  function cacheKey(action, payload) {
    return CACHE_PREFIX + (A.staff ? A.staff.name : '') + '|' + action + '|' + JSON.stringify(payload || {});
  }

  let refreshCount = 0;
  function refreshing(on) {
    refreshCount = Math.max(0, refreshCount + (on ? 1 : -1));
    let el = A.$('#o2d-refresh');
    if (!el) {
      el = document.createElement('div');
      el.id = 'o2d-refresh';
      el.setAttribute('role', 'status');
      el.style.cssText = 'position:fixed;top:calc(env(safe-area-inset-top,0px) + 70px);left:50%;transform:translateX(-50%);' +
        'background:var(--brand);color:#fff;font-size:12.5px;font-weight:600;padding:5px 12px;border-radius:999px;' +
        'z-index:60;box-shadow:0 2px 8px rgba(0,0,0,.15);display:none';
      el.textContent = 'Taaza ho raha hai…';
      document.body.appendChild(el);
    }
    el.style.display = refreshCount ? 'block' : 'none';
  }

  /**
   * Pichli baar ka data turant dikhao (agar phone mein hai), aur saath hi
   * server se taaza lao — aate hi screen badal jaati hai.
   *  onData(data, isOld)
   *  showLoader = false → peeche ka taaza (60 sec wala) — purana dobara nahi dikhate
   */
  const FRESH_MS = 20000;   // 20 sec se naya data phone mein ho toh server ka chakkar hi nahi

  A.fast = function (action, payload, onData, loadingText, showLoader) {
    const key = cacheKey(action, payload);
    let old = null;
    if (showLoader !== false) {
      try { old = JSON.parse(store.get(key) || 'null'); } catch (e) { old = null; }
    }
    // Abhi-abhi aaya data → seedha dikhao, server pe mat jao
    if (old && old.d !== undefined && old.t && Date.now() - old.t < FRESH_MS) {
      onData(old.d, false);
      return Promise.resolve(old.d);
    }
    // App khulte waqt "boot" waise bhi Home ka data la raha hai → alag se mat mangao
    if (action === 'home' && A.bootLoading && old && old.d !== undefined) {
      onData(old.d, true);
      return Promise.resolve(old.d);
    }
    if (old && old.d !== undefined) { onData(old.d, true); refreshing(true); }
    const p = (old || showLoader === false) ? A.api(action, payload) : A.call(action, payload, loadingText);
    return p.then(function (d) {
      if (old) refreshing(false);
      putCache(action, payload, d);
      if (action === 'home') A.seedHome(d);
      onData(d, false);
      return d;
    }, function (e) {
      if (old) { refreshing(false); A.toast(e.message, 'err'); return null; }   // purana data screen pe rehne do
      throw e;
    });
  };

  function putCache(action, payload, d) {
    store.set(cacheKey(action, payload), JSON.stringify({ t: Date.now(), d: d }));
  }

  /** Home ke data se har kaam ki list bhi phone mein rakh do → dabba dabate hi list */
  A.seedHome = function (home) {
    if (!home) return;
    putCache('home', {}, home);
    (home.groups || []).forEach(function (g) {
      putCache('stepList', { step: g.step }, {
        at: home.at,
        red: g.items.filter(function (c) { return c.color === 'red'; }).length,
        groups: [g]
      });
    });
  };

  /** List ke orders ki detail pehle se le aao (ek hi chakkar mein) → order pe tap karte hi khule */
  A.prefetchDetails = function (ids) {
    const need = (ids || []).filter(function (id) {
      try { const c = JSON.parse(store.get(cacheKey('orderDetail', { orderId: id })) || 'null'); return !c || Date.now() - c.t > 60000; }
      catch (e) { return true; }
    }).slice(0, 10);
    if (!need.length) return;
    A.api('details', { orderIds: need }).then(function (map) {
      Object.keys(map || {}).forEach(function (id) { putCache('orderDetail', { orderId: id }, map[id]); });
    }).catch(function () {});
  };

  /** Kuch save hua → phone ka data "purana" maan lo (dikhega turant, par taaza bhi aayega) */
  A.cacheStale = function () {
    try {
      Object.keys(localStorage).forEach(function (k) {
        if (k.indexOf(CACHE_PREFIX) !== 0) return;
        if (k.indexOf('|orderDetail|') >= 0) { localStorage.removeItem(k); return; }
        const c = JSON.parse(localStorage.getItem(k) || 'null');
        if (c) { c.t = 0; localStorage.setItem(k, JSON.stringify(c)); }
      });
      const b = JSON.parse(localStorage.getItem(BOOT_KEY) || 'null');
      if (b) { b.t = 0; localStorage.setItem(BOOT_KEY, JSON.stringify(b)); }
    } catch (e) {}
  };

  /** Step save hua → wo order list / ginti se turant hata do (server ka intezaar kiye bina) */
  A.cacheDropOrder = function (orderId) {
    try {
      Object.keys(localStorage).forEach(function (k) {
        if (k.indexOf(CACHE_PREFIX) !== 0) return;
        const c = JSON.parse(localStorage.getItem(k) || 'null');
        if (!c || !c.d) return;
        const d = c.d;
        if (k.indexOf('|home|') >= 0 && d.groups) {
          d.groups.forEach(function (g) {
            const it = g.items.filter(function (x) { return x.orderId === orderId; })[0];
            if (!it) return;
            g.items = g.items.filter(function (x) { return x.orderId !== orderId; });
            g.count = g.items.length;
            d.total = Math.max(0, (d.total || 0) - 1);
            if (it.color === 'red') d.red = Math.max(0, (d.red || 0) - 1);
            (d.steps || []).forEach(function (s) {
              if (s.step !== g.step) return;
              s.count = g.items.length;
              s.red = g.items.filter(function (x) { return x.color === 'red'; }).length;
              s.yellow = g.items.filter(function (x) { return x.color === 'yellow'; }).length;
              s.wait = g.items.filter(function (x) { return x.color === 'wait'; }).length;
            });
          });
        } else if (k.indexOf('|stepList|') >= 0 && d.groups) {
          d.groups.forEach(function (g) {
            g.items = g.items.filter(function (x) { return x.orderId !== orderId; });
            g.count = g.items.length;
          });
        }
        localStorage.setItem(k, JSON.stringify(c));
      });
    } catch (e) {}
    A.cacheStale();
  };

  /** Loading ke saath api — galti pe toast */
  A.call = function (action, payload, loadingText) {
    A.loading(true, loadingText || 'Ek second...');
    return A.api(action, payload)
      .then(function (d) { A.loading(false); return d; })
      .catch(function (e) { A.loading(false); A.toast(e.message, 'err'); throw e; });
  };

  /* ---------------- Save peeche se (button turant) ---------------- */

  const saving = [];

  function savingPill() {
    let el = A.$('#o2d-saving');
    if (!el) {
      el = document.createElement('div');
      el.id = 'o2d-saving';
      el.setAttribute('role', 'status');
      el.style.cssText = 'position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 84px);' +
        'background:var(--brand);color:#fff;font-size:13px;font-weight:600;padding:8px 14px;border-radius:999px;' +
        'z-index:60;box-shadow:0 4px 14px rgba(0,0,0,.18);display:none';
      document.body.appendChild(el);
    }
    el.textContent = saving.length === 1 ? 'Save ho raha hai… (' + saving[0].label + ')' : saving.length + ' save ho rahe hain…';
    el.style.display = saving.length ? 'block' : 'none';
  }

  function isNetErr(e) {
    return /Internet nahi|se jud nahi|Server se jawab nahi|mana kar diya/i.test(String(e && e.message || ''));
  }

  /**
   * job = { label, orderId, run() → Promise, okText(r), onLate(r) }
   * Net ki dikkat → khud 2 baar aur try. Phir bhi na ho → saaf message.
   */
  A.bgSave = function (job) {
    job.tries = 0;
    saving.push(job);
    savingPill();
    go();
    function done() {
      const i = saving.indexOf(job);
      if (i >= 0) saving.splice(i, 1);
      savingPill();
    }
    function go() {
      job.tries++;
      job.run().then(function (r) {
        done();
        if (r && r.needLateReason) { if (job.onLate) job.onLate(r); return; }
        A.cacheStale();
        A.toast(job.okText ? job.okText(r) : 'Save ho gaya.', 'ok');
      }, function (e) {
        if (isNetErr(e) && job.tries < 3) { setTimeout(go, 2500 * job.tries); return; }
        done();
        A.cacheStale();          // order wapas list mein aa jayega
        A.sheet(
          '<h3>Save nahi hua</h3>' +
          '<p style="margin-top:0"><b>' + A.esc(job.label) + '</b></p>' +
          '<div class="note err">' + A.esc(e.message || 'Kuch galat ho gaya.') + '</div>' +
          '<div class="btn-row" style="margin-top:12px">' +
            (job.orderId ? '<button class="btn btn-ghost" id="bs-open">Order kholo</button>' : '') +
            '<button class="btn btn-main" id="bs-retry">Dobara try karo</button>' +
          '</div>',
          function (el, close) {
            A.$('#bs-retry', el).onclick = function () { close(); A.bgSave(job); };
            const op = A.$('#bs-open', el);
            if (op) op.onclick = function () { close(); A.go('step', { orderId: job.orderId }); };
          });
      });
    }
  };

  // Save chal raha ho aur koi app band kare → browser poochega
  window.addEventListener('beforeunload', function (e) {
    if (saving.length) { e.preventDefault(); e.returnValue = ''; }
  });

  /* ---------------- Photo chhota karna ---------------- */

  /** File → { name, mimeType, data(base64), preview } */
  A.readPhoto = function (file) {
    return new Promise(function (resolve, reject) {
      const maxMb = (A.config && A.config.photo && A.config.photo.maxMb) || 10;
      if (file.type === 'application/pdf') {
        if (file.size > maxMb * 1048576) return reject(new Error('PDF ' + maxMb + ' MB se chhoti honi chahiye.'));
        const fr = new FileReader();
        fr.onload = function () { resolve({ name: file.name, mimeType: 'application/pdf', data: fr.result, preview: '', isPdf: true }); };
        fr.onerror = function () { reject(new Error('File nahi padh paye.')); };
        return fr.readAsDataURL(file);
      }
      if (!/^image\//.test(file.type)) return reject(new Error('Sirf photo ya PDF daal sakte ho.'));

      const fr = new FileReader();
      fr.onerror = function () { reject(new Error('Photo nahi padh paye.')); };
      fr.onload = function () {
        const img = new Image();
        img.onload = function () {
          const MAX = 1600;
          let w = img.naturalWidth, h = img.naturalHeight;
          if (w > MAX || h > MAX) { const s = MAX / Math.max(w, h); w = Math.round(w * s); h = Math.round(h * s); }
          const c = document.createElement('canvas');
          c.width = w; c.height = h;
          c.getContext('2d').drawImage(img, 0, 0, w, h);
          const data = c.toDataURL('image/jpeg', 0.78);
          resolve({ name: (file.name || 'photo').replace(/\.\w+$/, '') + '.jpg', mimeType: 'image/jpeg', data: data, preview: data });
        };
        img.onerror = function () {
          // Phone ki photo (HEIC) browser na khol paye toh waise hi bhejo
          if (file.size > maxMb * 1048576) return reject(new Error('Photo bahut badi hai.'));
          resolve({ name: file.name, mimeType: file.type, data: fr.result, preview: '' });
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  };

  /** Photo ko 90° ghumana (sirf photo, PDF nahi) */
  A.rotatePhoto = function (p) {
    return new Promise(function (resolve, reject) {
      if (!p.preview || p.isPdf) return reject(new Error('Yeh file ghuma nahi sakte.'));
      const img = new Image();
      img.onload = function () {
        const c = document.createElement('canvas');
        c.width = img.naturalHeight; c.height = img.naturalWidth;
        const ctx = c.getContext('2d');
        ctx.translate(c.width / 2, c.height / 2);
        ctx.rotate(Math.PI / 2);
        ctx.drawImage(img, -img.naturalWidth / 2, -img.naturalHeight / 2);
        const data = c.toDataURL('image/jpeg', 0.82);
        resolve({ name: p.name, mimeType: 'image/jpeg', data: data, preview: data });
      };
      img.onerror = function () { reject(new Error('Photo ghuma nahi paye.')); };
      img.src = p.preview;
    });
  };

  /** Chhupa hua file input — camera ya gallery khulta hai */
  function pickFiles(mode, multiple, onFiles) {
    const inp = document.createElement('input');
    inp.type = 'file';
    if (mode === 'camera') { inp.accept = 'image/*'; inp.setAttribute('capture', 'environment'); }
    else { inp.accept = 'image/*,application/pdf'; if (multiple) inp.multiple = true; }
    inp.style.display = 'none';
    inp.onchange = function () {
      const files = Array.prototype.slice.call(inp.files || []);
      if (inp.parentNode) inp.parentNode.removeChild(inp);
      if (files.length) onFiles(files);
    };
    document.body.appendChild(inp);
    inp.click();
  }

  const CAM_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';
  const GAL_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 17l-5-5-9 8"/></svg>';

  /**
   * Photo ka dibba:
   *  - "Photo khicho" (camera) + "Gallery se" (photo / PDF, kai ek saath)
   *  - li hui photo pe tap → badi dikhegi: Ghumao / Badlo / Hatao
   *  - kone pe × se jaldi hatao
   * box = khaali div, opts = { max, label }
   * Wapas: { get: () => [photos], count, clear }
   */
  A.photoPicker = function (box, opts) {
    opts = opts || {};
    const max = opts.max || (A.config && A.config.photo.maxPerField) || 10;
    const list = [];
    box.classList.add('photos');

    function addFiles(files, replaceIndex) {
      const take = replaceIndex === undefined ? files.slice(0, max - list.length) : files.slice(0, 1);
      if (!take.length) return;
      A.loading(true, 'Photo taiyar ho rahi hai...');
      Promise.all(take.map(A.readPhoto))
        .then(function (ps) {
          if (replaceIndex !== undefined) list[replaceIndex] = ps[0];
          else ps.forEach(function (p) { list.push(p); });
          A.loading(false);
          draw();
        })
        .catch(function (err) { A.loading(false); A.toast(err.message, 'err'); draw(); });
    }

    function openPhoto(i) {
      const p = list[i];
      A.sheet(
        '<h3>Photo ' + (i + 1) + '</h3>' +
        '<div style="background:var(--grey-bg);border-radius:var(--radius);display:flex;align-items:center;justify-content:center;min-height:180px;margin-bottom:14px;overflow:hidden">' +
          (p.preview ? '<img alt="" src="' + p.preview + '" style="max-width:100%;max-height:60vh;display:block">'
                     : '<div class="pdf" style="font-weight:700;color:var(--red);padding:40px">' + (p.isPdf ? 'PDF file' : 'Photo') + '</div>') +
        '</div>' +
        '<div class="btn-row" style="flex-wrap:wrap">' +
          (p.preview ? '<button type="button" class="btn btn-ghost" id="ph-rot">Ghumao</button>' : '') +
          '<button type="button" class="btn btn-ghost" id="ph-cam">Dobara khicho</button>' +
          '<button type="button" class="btn btn-ghost" id="ph-gal">Gallery se badlo</button>' +
        '</div>' +
        '<button type="button" class="btn btn-danger btn-block" id="ph-del" style="margin-top:10px">Hatao</button>',
        function (el, close) {
          const rot = A.$('#ph-rot', el);
          if (rot) rot.onclick = function () {
            A.rotatePhoto(list[i]).then(function (np) {
              list[i] = np;
              A.$('img', el).src = np.preview;
              draw();
            }).catch(function (e) { A.toast(e.message, 'err'); });
          };
          A.$('#ph-cam', el).onclick = function () { close(); pickFiles('camera', false, function (f) { addFiles(f, i); }); };
          A.$('#ph-gal', el).onclick = function () { close(); pickFiles('gallery', false, function (f) { addFiles(f, i); }); };
          A.$('#ph-del', el).onclick = function () { list.splice(i, 1); close(); draw(); };
        });
    }

    function draw() {
      box.innerHTML = '';
      list.forEach(function (p, i) {
        const d = document.createElement('div');
        d.className = 'photo-thumb';
        d.style.cursor = 'pointer';
        d.innerHTML = (p.preview ? '<img alt="" src="' + p.preview + '">' : '<div class="pdf">' + (p.isPdf ? 'PDF' : 'Photo') + '</div>') +
                      '<button type="button" class="x" aria-label="Hatao">×</button>' +
                      '<span style="position:absolute;left:0;right:0;bottom:0;background:rgba(16,24,40,.55);color:#fff;font-size:11px;text-align:center;padding:2px 0">Tap: badlo</span>';
        d.onclick = function (e) { if (e.target.classList.contains('x')) return; openPhoto(i); };
        A.$('.x', d).onclick = function (e) { e.stopPropagation(); list.splice(i, 1); draw(); };
        box.appendChild(d);
      });
      if (list.length < max) {
        const cam = document.createElement('button');
        cam.type = 'button';
        cam.className = 'photo-add';
        cam.innerHTML = CAM_ICON + '<span>Photo khicho</span>';
        cam.onclick = function () { pickFiles('camera', false, function (f) { addFiles(f); }); };
        box.appendChild(cam);

        const gal = document.createElement('button');
        gal.type = 'button';
        gal.className = 'photo-add';
        gal.innerHTML = GAL_ICON + '<span>Gallery se</span>';
        gal.onclick = function () { pickFiles('gallery', true, function (f) { addFiles(f); }); };
        box.appendChild(gal);
      }
    }
    draw();
    return {
      get: function () { return list.map(function (p) { return { name: p.name, mimeType: p.mimeType, data: p.data }; }); },
      count: function () { return list.length; },
      clear: function () { list.length = 0; draw(); }
    };
  };

  /* ---------------- Video (Packing) ---------------- */

  const VID_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3z"/></svg>';
  const VID_GAL_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M10 9l5 3-5 3z"/></svg>';

  /** Video kitne second ki hai (phone na bata paaye toh 0) */
  function videoSeconds(file) {
    return new Promise(function (resolve) {
      let url = '';
      try { url = URL.createObjectURL(file); } catch (e) { return resolve(0); }
      const v = document.createElement('video');
      v.preload = 'metadata';
      v.muted = true;
      const done = function (s) { try { URL.revokeObjectURL(url); } catch (e) {} resolve(s); };
      const t = setTimeout(function () { done(0); }, 6000);
      v.onloadedmetadata = function () { clearTimeout(t); done(isFinite(v.duration) ? v.duration : 0); };
      v.onerror = function () { clearTimeout(t); done(0); };
      v.src = url;
    });
  }

  /** File ka ek tukda → base64 */
  function readChunk(file, start, end) {
    return new Promise(function (resolve, reject) {
      const fr = new FileReader();
      fr.onload = function () { resolve(String(fr.result).split(',')[1] || ''); };
      fr.onerror = function () { reject(new Error('Video padh nahi paye.')); };
      fr.readAsDataURL(file.slice(start, end));
    });
  }

  function mmss(s) { s = Math.round(s || 0); return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }

  /**
   * Video ka dibba (Packing):
   *  - "Video banao" (camera) + "Gallery se video" (kai ek saath)
   *  - chunte hi upload shuru, har video pe % dikhta hai
   *  - × se hatao (Drive se bhi hat jaati hai)
   * opts = { orderId, max, maxSeconds, maxMb }
   * Wapas: { get, busy, count }
   */
  A.videoPicker = function (box, opts) {
    opts = opts || {};
    const max = opts.max || 3, maxSec = opts.maxSeconds || 60, maxMb = opts.maxMb || 200;
    const list = [];
    let running = false;
    box.classList.add('photos');

    function addFiles(files) {
      const room = max - list.length;
      if (files.length > room) A.toast('Ek order mein ' + max + ' video tak. Pehli ' + room + ' le li.', 'err');
      files.slice(0, Math.max(0, room)).forEach(function (f) {
        if (!/^video\//.test(f.type || 'video/')) { A.toast('"' + f.name + '" video nahi hai.', 'err'); return; }
        if (f.size > maxMb * 1048576) { A.toast('Video ' + maxMb + ' MB se chhoti honi chahiye (yeh ' + Math.round(f.size / 1048576) + ' MB hai).', 'err'); return; }
        const item = { file: f, sec: 0, status: 'check', pct: 0, err: '', fileId: '' };
        list.push(item);
        videoSeconds(f).then(function (s) {
          item.sec = s;
          if (s > maxSec + 2) {
            list.splice(list.indexOf(item), 1);
            A.toast('Video ' + maxSec + ' second tak ki honi chahiye (yeh ' + Math.round(s) + ' second ki hai).', 'err');
          } else item.status = 'wait';
          draw(); next();
        });
      });
      draw();
    }

    function next() {
      if (running) return;
      const item = list.filter(function (x) { return x.status === 'wait'; })[0];
      if (!item) return;
      running = true;
      upload(item).then(function () { running = false; next(); });
    }

    function upload(item) {
      item.status = 'up'; item.pct = 0; item.err = ''; draw();
      const f = item.file;
      return A.api('videoStart', { orderId: opts.orderId, name: f.name, mimeType: f.type || 'video/mp4', size: f.size, seconds: item.sec })
        .then(function (r) {
          item.uploadId = r.uploadId;
          const size = r.chunkBytes;
          function sendFrom(offset, tries) {
            if (list.indexOf(item) < 0) return Promise.resolve();          // beech mein hata di
            const end = Math.min(offset + size, f.size);
            return readChunk(f, offset, end)
              .then(function (b64) { return A.api('videoChunk', { uploadId: item.uploadId, offset: offset, data: b64 }); })
              .then(function (res) {
                if (res.done) { item.fileId = res.fileId; item.status = 'done'; item.pct = 100; draw(); return; }
                item.pct = Math.min(99, Math.round((res.next / f.size) * 100)); draw();
                return sendFrom(res.next, 0);
              }, function (e) {
                if (tries < 2) return new Promise(function (ok) { setTimeout(ok, 2000); }).then(function () { return sendFrom(offset, tries + 1); });
                throw e;
              });
          }
          return sendFrom(0, 0);
        })
        .then(function () {
          if (list.indexOf(item) < 0 && item.fileId) A.api('videoDelete', { fileId: item.fileId }).catch(function () {});
        })
        .catch(function (e) { item.status = 'err'; item.err = e.message; draw(); });
    }

    function remove(i) {
      const item = list[i];
      list.splice(i, 1);
      if (item.fileId) A.api('videoDelete', { fileId: item.fileId }).catch(function () {});
      draw();
    }

    function draw() {
      box.innerHTML = '';
      list.forEach(function (it, i) {
        const d = document.createElement('div');
        d.className = 'photo-thumb';
        const label = it.status === 'done' ? 'Ho gayi ✓'
                    : it.status === 'err' ? 'Ruk gayi'
                    : it.status === 'check' ? 'Check...'
                    : it.status === 'wait' ? 'Line mein' : it.pct + '%';
        const col = it.status === 'done' ? 'var(--green)' : (it.status === 'err' ? 'var(--red)' : 'var(--brand)');
        d.innerHTML =
          '<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:' + col + ';font-size:12px;font-weight:600;background:var(--grey-bg)">' +
            '<span style="width:22px;height:22px;display:block">' + VID_ICON + '</span>' +
            '<span>Video ' + (i + 1) + (it.sec ? ' · ' + mmss(it.sec) : '') + '</span><span>' + label + '</span></div>' +
          (it.status === 'up' ? '<div style="position:absolute;left:0;bottom:0;height:4px;background:var(--brand);width:' + it.pct + '%"></div>' : '') +
          '<button type="button" class="x" aria-label="Hatao">×</button>';
        A.$('.x', d).onclick = function (e) { e.stopPropagation(); remove(i); };
        if (it.status === 'err') {
          d.style.cursor = 'pointer';
          d.onclick = function () {
            A.sheet('<h3>Video ' + (i + 1) + ' upload nahi hui</h3><p class="muted">' + A.esc(it.err) + '</p>' +
              '<div class="btn-row"><button class="btn btn-ghost" id="v-del">Hatao</button><button class="btn btn-main" id="v-re">Dobara try karo</button></div>',
              function (el, close) {
                A.$('#v-del', el).onclick = function () { close(); remove(i); };
                A.$('#v-re', el).onclick = function () { close(); it.status = 'wait'; draw(); next(); };
              });
          };
        }
        box.appendChild(d);
      });
      if (list.length < max) {
        const cam = document.createElement('button');
        cam.type = 'button'; cam.className = 'photo-add';
        cam.innerHTML = VID_ICON + '<span>Video banao</span>';
        cam.onclick = function () { pickVideo(true, addFiles); };
        box.appendChild(cam);
        const gal = document.createElement('button');
        gal.type = 'button'; gal.className = 'photo-add';
        gal.innerHTML = VID_GAL_ICON + '<span>Gallery se video</span>';
        gal.onclick = function () { pickVideo(false, addFiles); };
        box.appendChild(gal);
      }
    }

    function pickVideo(camera, onFiles) {
      const inp = document.createElement('input');
      inp.type = 'file';
      inp.accept = 'video/*';
      if (camera) inp.setAttribute('capture', 'environment'); else inp.multiple = true;
      inp.style.display = 'none';
      inp.onchange = function () {
        const files = Array.prototype.slice.call(inp.files || []);
        if (inp.parentNode) inp.parentNode.removeChild(inp);
        if (files.length) onFiles(files);
      };
      document.body.appendChild(inp);
      inp.click();
    }

    draw();
    return {
      get: function () { return list.filter(function (x) { return x.status === 'done'; }).map(function (x) { return { fileId: x.fileId }; }); },
      busy: function () { return list.some(function (x) { return x.status === 'up' || x.status === 'wait' || x.status === 'check'; }); },
      failed: function () { return list.some(function (x) { return x.status === 'err'; }); },
      count: function () { return list.length; }
    };
  };

  /** Photo / video ke link: "Photo 1 · Video 1" */
  A.mediaLinks = function (urls) {
    let p = 0, v = 0;
    return (urls || []).map(function (u) {
      const isV = /#video$/.test(u);
      const label = isV ? 'Video ' + (++v) : 'Photo ' + (++p);
      return '<a href="' + A.esc(u) + '" target="_blank" rel="noopener">' + label + '</a>';
    }).join(' · ');
  };

  /* ---------------- Neeche se sheet ---------------- */

  A.sheet = function (html, onMount) {
    const bg = document.createElement('div');
    bg.className = 'sheet-bg';
    bg.innerHTML = '<div class="sheet" role="dialog">' + html + '</div>';
    bg.addEventListener('click', function (e) { if (e.target === bg) close(); });
    document.body.appendChild(bg);
    function close() { if (bg.parentNode) bg.parentNode.removeChild(bg); }
    if (onMount) onMount(A.$('.sheet', bg), close);
    return close;
  };

  /* ---------------- Screens + tabs ---------------- */

  const ICONS = {
    home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>',
    lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
    work: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>',
    add: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>',
    list: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 4h10l3 4v12H4V8z"/><path d="M8 12h8M8 16h5"/></svg>',
    chart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
    more: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>'
  };

  /** Neeche / left ke tabs */
  A.tabsFor = function () {
    if (!A.staff) return [];
    const tabs = [
      { key: 'home', label: 'Kaam', icon: 'home', match: ['home', 'myWork', 'step', 'newOrder'] },
      { key: 'orders', label: 'Sab Orders', icon: 'list', match: ['orders', 'orderDetail'] }
    ];
    if (A.director) tabs.push({ key: 'dashboard', label: 'Dashboard', icon: 'chart', match: ['dashboard'] });
    tabs.push({ key: 'more', label: 'Mera Account', icon: 'more', match: ['more', 'staff'] });
    return tabs.filter(function (t) { return !!A.screens[t.key]; });
  };

  function drawTabs() {
    const nav = A.$('#tabs');
    if (!nav) return;
    if (!A.config) { nav.innerHTML = ''; return; }
    nav.innerHTML = A.tabsFor().map(function (t) {
      const on = t.match.indexOf(A.current) >= 0;
      return '<button type="button" class="tab' + (on ? ' active' : '') + '" data-tab="' + t.key + '">' +
             ICONS[t.icon] + '<span>' + A.esc(t.label) + '</span>' +
             (t.key === 'home' && A.redCount ? '<span class="badge">' + A.redCount + '</span>' : '') + '</button>';
    }).join('');
    A.$$('.tab', nav).forEach(function (b) { b.onclick = function () { A.go(b.getAttribute('data-tab')); }; });
  }
  A.drawTabs = drawTabs;

  /** Screen badalna */
  A.go = function (name, params) {
    const view = A.$('#view');
    const scr = A.screens[name];
    A.current = name;
    window.scrollTo(0, 0);
    document.body.classList.remove('is-login');
    drawWho();
    drawTabs();
    if (!scr) {
      view.innerHTML = '<div class="empty"><b>Yeh screen jald aa rahi hai</b>Abhi ban rahi hai.</div>';
      return;
    }
    try {
      scr.render(view, params || {});
    } catch (e) {
      view.innerHTML = '<div class="note err">' + A.esc(e.message) + '</div>';
    }
  };

  /** Upar staff ka naam + role (gol nishaan mein naam ke pehle akshar) */
  function drawWho() {
    const who = A.$('#who');
    if (!who) return;
    if (!A.staff) { who.innerHTML = ''; return; }
    const d = A.staff;
    const ini = d.name.replace(/^(mr|mrs|ms)\.?\s+/i, '').split(/\s+/).map(function (w) { return w.charAt(0); }).join('').slice(0, 2).toUpperCase();
    who.innerHTML = '<span class="av">' + A.esc(ini) + '</span><span class="tx"><span class="nm">' + A.esc(d.name) +
                    '</span><br><span class="rl">' + A.esc(d.role) + '</span></span>';
  }

  /** Page ka heading (har screen isi se) */
  A.pageHead = function (title, sub, rightHtml) {
    return '<div class="page-head"><div><h1 class="screen-title">' + A.esc(title) + '</h1>' +
           (sub ? '<p class="screen-sub">' + A.esc(sub) + '</p>' : '') + '</div>' + (rightHtml || '') + '</div>';
  };

  /** Pehli screen (role ke hisaab se) */
  A.home = function () { A.go('home'); };

  /* ---------------- Shuruaat: pehle login window (PMS jaisa) ---------------- */

  function applyBoot(d) {
    A.config = d.config;
    A.staff = d.me;
    A.director = d.me.isAdmin ? d.me : null;
  }

  /**
   * fresh = login ke jawab mein aaya data (tab server pe dobara jaane ki zaroorat nahi)
   */
  A.start = function (thenGo, fresh) {
    if (!A.token()) { A.showLogin(); return; }

    if (fresh && fresh.me && fresh.config) {
      fresh.t = Date.now();
      store.set(BOOT_KEY, JSON.stringify(fresh));
      applyBoot(fresh);
      A.seedHome(fresh.home);
      A.go(thenGo || 'home');
      return;
    }

    // Pichli baar ki settings phone mein hain → app turant khulo, taaza peeche se
    let cached = null;
    try { cached = JSON.parse(store.get(BOOT_KEY) || 'null'); } catch (e) { cached = null; }
    const haveCache = !!(cached && cached.me && cached.config);
    if (haveCache && cached.t && Date.now() - cached.t < FRESH_MS) { applyBoot(cached); A.go(thenGo || 'home'); return; }   // abhi-abhi ka hai
    A.bootLoading = haveCache;
    if (haveCache) { applyBoot(cached); refreshing(true); A.go(thenGo || 'home'); }
    else A.loading(true, 'Khul raha hai...');

    A.api('boot', {})
      .then(function (d) {
        if (A.bootLoading) refreshing(false);
        A.bootLoading = false;
        A.loading(false);
        const first = !cached || !cached.me;
        const changed = !first && (cached.me.name !== d.me.name || cached.me.isAdmin !== d.me.isAdmin ||
          JSON.stringify(cached.me.steps) !== JSON.stringify(d.me.steps));
        applyBoot(d);
        d.t = Date.now();
        store.set(BOOT_KEY, JSON.stringify(d));
        A.seedHome(d.home);
        if (first || changed || A.current === 'home') A.go(first || changed ? (thenGo || 'home') : 'home');
        else A.drawTabs();
      })
      .catch(function (e) {
        A.loading(false);
        if (A.bootLoading) refreshing(false);
        A.bootLoading = false;
        if (A.current === 'login') return;     // login khatam → login window khul chuki
        if (cached && cached.me) { A.toast(e.message, 'err'); return; }
        A.$('#view').innerHTML = '<div class="note err">' + A.esc(e.message) + '</div>' +
          '<button class="btn btn-main btn-block" onclick="O2D.start()">Dobara try karo</button>';
      });
  };

  /* ---------------- "Mera Account" screen ---------------- */

  A.screens.more = {
    render: function (view) {
      if (!A.staff) { A.showLogin(); return; }
      const s = A.staff;
      const steps = s.isAdmin ? 'Sab kaam + Dashboard' : ((s.stepLabels || []).join(', ') || '-');
      view.innerHTML =
        A.pageHead('Mera Account', '') +
        '<div class="panel">' +
          '<ul class="list-plain">' +
            '<li class="row between"><span class="muted">Naam</span><b>' + A.esc(s.name || '') + '</b></li>' +
            '<li class="row between"><span class="muted">Role</span><b>' + A.esc(s.role || '') + '</b></li>' +
            '<li class="row between" style="align-items:flex-start"><span class="muted">Kaam</span><b style="text-align:right">' + A.esc(steps || '-') + '</b></li>' +
          '</ul>' +
        '</div>' +
        '<div class="panel">' +
          (A.screens.staff && s.isDirector ? '<button class="btn btn-ghost btn-block" id="m-staff">Staff sambhalo</button><div style="height:10px"></div>' : '') +
          '<button class="btn btn-ghost btn-block" id="m-pin">Apna PIN badlo</button>' +
          '<div style="height:10px"></div>' +
          '<button class="btn btn-danger btn-block" id="m-out">Logout</button>' +
        '</div>';
      const st = A.$('#m-staff');
      if (st) st.onclick = function () { A.go('staff'); };
      A.$('#m-pin').onclick = openPinChange;
      A.$('#m-out').onclick = function () { A.showLogin('Logout ho gaye.'); };
    }
  };

  function openPinChange() {
    A.sheet(
      '<h3>Apna PIN badlo</h3>' +
      '<div class="field"><label>Purana PIN</label><input class="input" id="p-old" inputmode="numeric" maxlength="4" type="password"></div>' +
      '<div class="field"><label>Naya PIN (4 ank)</label><input class="input" id="p-new" inputmode="numeric" maxlength="4" type="password">' +
      '<div class="hint">0000 ya 1234 jaisa aasaan PIN nahi chalega.</div></div>' +
      '<button class="btn btn-main btn-block" id="p-save">PIN badlo</button>',
      function (el, close) {
        A.$('#p-save', el).onclick = function () {
          A.call('changePin', { oldPin: A.$('#p-old', el).value, newPin: A.$('#p-new', el).value }, 'PIN badal raha hai...')
            .then(function () { close(); A.toast('PIN badal gaya.', 'ok'); })
            .catch(function () {});
        };
      });
  }

})(window.O2D);
</script>


  <!--
  ============================================================
   Screen_Login.html  —  Login window (PMS jaisa simple)
  ============================================================
   Link kholte hi sabse pehle yahi:
   - Staff ka APNA link (?u=...) → SIRF uska naam, sirf PIN.
     Phone yeh link yaad rakhta hai — refresh karo, home screen icon
     se kholo, logout karo — har baar wahi ek naam (baaki naam kabhi nahi).
     Link band ho gaya ho toh koi naam nahi, sirf "naya link mango".
   - Common link → neeche wale 3 kadam
   1. "Apna naam chuno" — dropdown (Staff tab ke Active log)
   2. PIN — 4 ank (Staff tab ke PIN column wala)
   3. "Andar jao" — 4 ank poore hote hi apne aap bhi khul jaata hai
   Phone pichla naam yaad rakhta hai, aur login 30 din tak.
   Staff ko sirf apne kaam dikhte hain, Director / PC ko sab.
  ============================================================
-->
<script>
(function (A) {
  'use strict';

  const LAST_KEY = 'o2d_login_name';

  function lastName() { try { return localStorage.getItem(LAST_KEY) || ''; } catch (e) { return ''; } }
  function saveName(n) { try { localStorage.setItem(LAST_KEY, n); } catch (e) {} }

  A.screens.login = {
    render: function (view, params) {
      document.body.classList.add('is-login');
      const nav = A.$('#tabs');
      if (nav) nav.innerHTML = '';

      const names = window.O2D_NAMES || [];
      const last = lastName();
      const link = window.O2D_LINK && names.length === 1 ? String(window.O2D_LINK) : '';
      const firstMsg = params.msg || window.O2D_LINK_ERR || '';

      // Staff ka link band ho chuka hai → koi naam nahi dikhana
      if (window.O2D_LINK_ERR && !names.length) {
        view.innerHTML =
          '<div class="login-page"><div class="login-card">' +
            '<div class="login-top"><div class="logo">RKG</div><b>RK Garg Jeans</b><small>Order To Dispatch</small></div>' +
            '<div class="login-body" style="text-align:left">' +
              '<h2>Yeh link band ho chuka hai</h2>' +
              '<p style="margin-top:8px">Director se apna naya link mango aur usi link se kholo.</p>' +
            '</div>' +
          '</div></div>';
        return;
      }

      const nameHtml = link
        ? '<div class="field" style="margin-top:16px"><label>Aapka naam</label>' +
            '<div class="input" style="display:flex;align-items:center;font-weight:600;background:var(--bg)">' + A.esc(names[0]) + '</div>' +
            '<input type="hidden" id="lg-name" value="' + A.esc(names[0]) + '"></div>'
        : '<div class="field" style="margin-top:16px"><label for="lg-name">Apna naam</label>' +
            '<select class="select" id="lg-name"><option value="">— Naam chuno —</option>' +
              names.map(function (n) { return '<option value="' + A.esc(n) + '"' + (n === last ? ' selected' : '') + '>' + A.esc(n) + '</option>'; }).join('') +
            '</select>' +
            (names.length ? '' : '<div class="hint" style="color:var(--red)">Staff list khaali hai — Staff tab mein naam aur Active tick check karo.</div>') +
          '</div>';

      view.innerHTML =
        '<div class="login-page"><div class="login-card">' +
          '<div class="login-top"><div class="logo">RKG</div><b>RK Garg Jeans</b><small>Order To Dispatch</small></div>' +
          '<div class="login-body" style="text-align:left">' +
            '<h2>' + (link ? 'Namaste ' + A.esc(names[0]) : 'Login karo') + '</h2>' +
            '<p>' + (link ? 'Apna 4 ank ka PIN daalo' : 'Apna naam chuno aur PIN daalo') + '</p>' +
            nameHtml +
            '<div class="field" style="margin-bottom:0"><label for="lg-pin">PIN</label>' +
              '<input class="input pin-input" id="lg-pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="current-password" placeholder="••••">' +
            '</div>' +
            '<div class="pin-msg" id="lg-msg">' + A.esc(firstMsg) + '</div>' +
            '<button type="button" class="btn btn-main btn-block" id="lg-go">Andar jao</button>' +
          '</div>' +
          '<div class="login-foot">PIN bhool gaye? Director se poochho.</div>' +
        '</div></div>';

      const sel = A.$('#lg-name', view);
      const pin = A.$('#lg-pin', view);
      const msg = A.$('#lg-msg', view);
      const btn = A.$('#lg-go', view);
      let busy = false;

      function shake() { pin.classList.remove('shake'); void pin.offsetWidth; pin.classList.add('shake'); }

      function submit() {
        if (busy) return;
        const name = sel.value;
        const p = pin.value.replace(/\D/g, '');
        if (!name) { msg.textContent = 'Pehle apna naam chuno.'; sel.focus(); return; }
        if (p.length !== 4) { msg.textContent = 'PIN 4 ank ka hai.'; pin.focus(); return; }
        busy = true; btn.disabled = true; msg.textContent = '';
        A.loading(true, 'Check ho raha hai...');
        (link ? A.api('loginLink', { code: link, pin: p }) : A.api('login', { name: name, pin: p }))
          .then(function (d) {
            A.loading(false);
            saveName(name);
            A.setLogin(d.token);
            document.body.classList.remove('is-login');
            A.start('home', d.boot);      // login ke saath hi data aa gaya → seedha Home
          })
          .catch(function (e) {
            A.loading(false);
            busy = false; btn.disabled = false;
            pin.value = '';
            msg.textContent = e.message;
            shake();
            pin.focus();
          });
      }

      if (!link) sel.onchange = function () { msg.textContent = ''; if (sel.value) pin.focus(); };
      pin.addEventListener('input', function () {
        pin.value = pin.value.replace(/\D/g, '').slice(0, 4);
        msg.textContent = '';
        if (pin.value.length === 4 && sel.value) submit();
      });
      pin.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
      btn.onclick = submit;
      setTimeout(function () { (sel.value || link ? pin : sel).focus(); }, 150);
    }
  };

})(window.O2D);
</script>

  <!--
  ============================================================
   Screen_Home.html  —  Home (PMS jaisa, bina login)
  ============================================================
   Login ke baad yahi screen (sirf apne kaam ke dabbe):
   - "Naya Order" ka bada dabba
   - Har kaam ka dabba: Stock Hai?, Maal Ready, Bill Banao,
     Bill Check, Packing, Bilty — har ek pe:
       kitne pending, kitne late (laal), kiske paas
   - Dabbe pe tap → us kaam ke orders ki list
   - Har 60 second mein apne aap taaza
  ============================================================
-->
<script>
(function (A) {
  'use strict';

  let timer = null;

  A.screens.home = {
    render: function (view) {
      clearInterval(timer);
      view.innerHTML =
        A.pageHead('Kaam', 'Load ho raha hai...', '<button class="btn btn-ghost btn-sm" id="h-ref">Taaza karo</button>') +
        '<div id="h-body"></div>';
      A.$('#h-ref', view).onclick = function () { load(true); };

      function tile(opts) {
        const bad = opts.red ? '<span class="pill red">' + opts.red + ' late</span>'
                  : (opts.yellow ? '<span class="pill yellow">' + opts.yellow + ' jaldi</span>' : '');
        return '<button type="button" class="kpi" data-go="' + A.esc(opts.go) + '" data-step="' + A.esc(opts.step || '') + '" ' +
          'style="text-align:left;cursor:pointer;border-left:4px solid ' + opts.edge + ';width:100%;font:inherit;color:inherit">' +
          '<div class="row between" style="align-items:flex-start"><div class="k-label" style="font-size:14px;font-weight:600;color:var(--text)">' + A.esc(opts.title) + '</div>' + bad + '</div>' +
          '<div class="k-val" style="margin-top:6px">' + A.esc(opts.val) + '</div>' +
          '<div class="muted small">' + A.esc(opts.sub || '') + '</div>' +
          '</button>';
      }

      function draw(d) {
        if (A.current !== 'home') return;
        A.redCount = d.red;
        A.drawTabs();
        A.$('.screen-sub', view).textContent = d.total
          ? A.staff.name + ' · ' + d.total + ' order pending' + (d.red ? ' — ' + d.red + ' late' : '') + ' · ' + d.at
          : A.staff.name + ' · abhi koi kaam pending nahi · ' + d.at;

        let h = '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px">';
        if (A.screens.newOrder && d.canNewOrder) {
          h += '<button type="button" class="kpi" data-go="newOrder" style="text-align:left;cursor:pointer;width:100%;font:inherit;' +
               'background:var(--brand);color:#fff;border-color:var(--brand)">' +
               '<div style="font-size:14px;font-weight:600;opacity:.9">Naya Order</div>' +
               '<div style="font-size:26px;font-weight:700;margin-top:6px">+ Order bharo</div>' +
               '<div class="small" style="opacity:.8">Customer ka naya order</div></button>';
        }
        d.steps.forEach(function (s) {
          h += tile({
            go: 'myWork', step: s.step, title: s.label,
            val: s.count ? s.count + ' pending' : 'Sab ho gaya',
            sub: (d.who[s.step] || 'Director') + (s.wait ? ' · ' + s.wait + ' maal ka intezaar' : ''),
            red: s.red, yellow: s.yellow,
            edge: s.red ? 'var(--red)' : (s.yellow ? 'var(--amber)' : (s.count ? 'var(--green)' : 'var(--border)'))
          });
        });
        h += '</div>';
        A.$('#h-body', view).innerHTML = h;
        A.$$('[data-go]', view).forEach(function (b) {
          b.onclick = function () { A.go(b.getAttribute('data-go'), { step: b.getAttribute('data-step') }); };
        });
      }

      function load(showLoader) {
        if (A.current !== 'home') { clearInterval(timer); return; }
        A.fast('home', {}, draw, 'Kaam la rahe hain...', showLoader)
          .catch(function (e) { if (showLoader && A.current === 'home') A.$('#h-body', view).innerHTML = '<div class="note err">' + A.esc(e.message) + '</div>'; });
      }

      load(true);
      timer = setInterval(function () { load(false); }, 60000);
    }
  };

})(window.O2D);
</script>

  <!--
  ============================================================
   Screen_MyWork.html  —  Ek kaam ke pending orders
  ============================================================
   Home pe kisi kaam ke dabbe pe tap → yeh list.
   - Har order ek card: rangeen patti + goli
       laal = late, peela = 80% time gaya, hara = time hai, neela = maal ka intezaar
   - Laal sabse upar
   - Card pe tap → us order ka step bharne ki screen
   - Har 60 second mein apne aap taaza
  ============================================================
-->
<script>
(function (A) {
  'use strict';

  /** Order card (baaki screens bhi yahi use karti hain) */
  A.slipHtml = function (c, extra) {
    const meta = [c.city, c.item].filter(Boolean).join(' · ');
    const right = c.signal ? '<span class="pill ' + A.esc(c.color) + '">' + A.esc(c.signal) + '</span>' : '';
    return '<button type="button" class="slip ' + A.esc(c.color || '') + '" data-oid="' + A.esc(c.orderId) + '" data-step="' + A.esc(c.step || '') + '">' +
      '<div class="slip-top"><span class="oid">' + A.esc(c.orderId) + '</span>' + right + '</div>' +
      '<div class="slip-cust">' + A.esc(c.customer) + '</div>' +
      (meta ? '<div class="slip-meta">' + A.esc(meta) + '</div>' : '') +
      (extra ? '<div class="slip-foot">' + extra + '</div>' : '') +
      '</button>';
  };

  let timer = null;

  A.screens.myWork = {
    render: function (view, params) {
      clearInterval(timer);
      const step = params.step || A.lastStep;
      if (!step) { A.go('home'); return; }
      A.lastStep = step;
      const cfg = (A.config.steps || []).filter(function (s) { return s.key === step; })[0] || { label: step };

      view.innerHTML = A.pageHead(cfg.label, 'Load ho raha hai...',
        '<div class="row" style="gap:8px"><button class="btn btn-ghost btn-sm" id="mw-back">Wapas</button>' +
        '<button class="btn btn-ghost btn-sm" id="mw-refresh">Taaza karo</button></div>') +
        '<div id="mw-body"></div>';
      A.$('#mw-back', view).onclick = function () { A.go('home'); };
      A.$('#mw-refresh', view).onclick = function () { load(true); };

      function load(showLoader) {
        if (A.current !== 'myWork') { clearInterval(timer); return; }
        A.fast('stepList', { step: step }, draw, 'Orders la rahe hain...', showLoader)
          .catch(function (e) {
            if (showLoader) A.$('#mw-body', view).innerHTML = '<div class="note err">' + A.esc(e.message) + '</div>';
          });
      }

      function draw(d, isOld) {
        if (A.current !== 'myWork') return;
        const g = (d.groups || [])[0] || { items: [] };
        A.$('.screen-sub', view).textContent = g.items.length
          ? g.items.length + ' order pending' + (d.red ? ' — ' + d.red + ' late' : '') + ' · ' + d.at
          : 'Koi order pending nahi · ' + d.at;

        const body = A.$('#mw-body', view);
        if (!g.items.length) {
          body.innerHTML = '<div class="panel empty"><b>Sab ho gaya</b>Naya order aate hi yahan dikhega.</div>';
          return;
        }
        body.innerHTML = g.items.map(function (c) {
          const bits = [];
          if (c.deadline) bits.push('Deadline: ' + c.deadline);
          if (c.billNo) bits.push('Bill ' + c.billNo);
          if (c.courierType) bits.push(c.courierType);
          return A.slipHtml(c, '<span>' + A.esc(bits.join(' · ')) + '</span><span>' + A.esc(c.payment || '') + '</span>');
        }).join('');

        A.$$('.slip', body).forEach(function (b) {
